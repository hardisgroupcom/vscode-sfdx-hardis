        vscodeIcon: organization
        sldsIcon: utility:groups
        tooltip: Creates the teammate branches and Pull Requests a Level 2 lab needs
        command: node scripts/training.mjs simulate --level 2
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-2/lab-06-conflicts/
      - id: training-l2-seed
        label: Set up one of my training orgs
        vscodeIcon: cloud-upload
        sldsIcon: utility:upload
        tooltip: Deploys the Helios Energy app and its sample data into the org you choose
        command: node scripts/training.mjs seed
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-2/
      - id: training-l2-check
        label: Check my work
        vscodeIcon: pass
        sldsIcon: utility:check
        tooltip: Verifies the Level 2 lab you just finished and prints your receipt
        command: node scripts/training.mjs check --level 2
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/badges/
      - id: training-l2-reset
        label: Reset this level
        vscodeIcon: debug-restart
        sldsIcon: utility:refresh
        tooltip: Puts your repository back to the start of Level 2
        command: node scripts/training.mjs reset --level 2
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-2/

  - id: training-level-3
    label: "Training: Level 3"
    description: Release Manager - the commands the Level 3 labs ask for
    vscodeIcon: mortar-board
    sldsIcon: utility:education
    welcomeIconClass: violet
    commands:
      - id: training-l3-status
        label: Where am I?
        vscodeIcon: compass
