# Helios Energy - sfdx-hardis training project
# This file is read by sfdx-hardis and by the VS Code extension.
# Doc: https://sfdx-hardis.cloudity.com/salesforce-devops-config-home/

projectName: HeliosEnergy

# --- Pipeline -------------------------------------------------------------
# At Levels 1 and 2 the pipeline is integration then uat, both deploying to
# scratch orgs that Set up my training environment creates. preprod and main
# exist in the fork and have no org yet: Lab 3.1 is where they join.
developmentBranch: integration
productionBranch: main
# How the CI job gets into an org. Levels 1 and 2 use auth URLs kept in
# GitHub secrets, which is the shortcut, so there is no certificate to look for
# and the pipeline is right not to ask for one. Lab 3.2 replaces it with
# a JWT certificate and puts this back to encryptedCert.
orgAuthenticationMode: secretsOnly
# One entry on purpose. A contributor at Levels 1 and 2 has exactly one place
# to send a User Story, and a question with one answer is a question that
# cannot be got wrong. uat is a major branch all the same: work reaches it by
# promotion, never by a User Story. Lab 3.1 adds preprod here, for hotfixes.
availableTargetBranches:
  - integration
availableTargetBranchesLabels:
  - "The shared integration org, where every contributor merges"

# Branch naming for new User Stories
branchPrefixChoices:
  - value: features
    title: "Feature: a new capability or an improvement"
  - value: fix
    title: "Fix: correct something that is broken"
newTaskNameRegex: '^US-\d{3}-[a-z0-9-]+$'
newTaskNameRegexExample: "US-014-panels-required"
# The stories live in the backlog of this course, not in a ticketing tool. These two
# keys let the Pull Request comments link every US-nnn they meet to its story.
genericTicketingProviderRegex: "(US-[0-9]{3})"
genericTicketingProviderUrlBuilder: "https://hardisgroupcom.github.io/sfdx-hardis-training/BACKLOG/#{REF}"

# --- Quality --------------------------------------------------------------
testLevel: RunLocalTests
apexTestsMinCoverageOrgWide: 75
testCoverageNotBlocking: false

# --- Automated cleaning ---------------------------------------------------
# Applied by hardis:work:save before the Pull Request. Lab 1.5 reads the
# result, Lab 3.5 explains why each one is here.
autoCleanTypes:
  - destructivechanges
  - localfields
  - productrequest
  - flowPositions
  - minimizeProfiles
  - listViewsMine

# Permissions that must never travel through a Profile on this project.
# This is what makes the Lab 2.6 failure happen, and it is deliberate.
autoRemoveUserPermissions:
  - EnableCommunityAppLauncher
  - FieldServiceAccess
  - OmnichannelInventorySync
  - SendExternalEmailAvailable
  - WorkCalibrationUser

# --- Data -----------------------------------------------------------------
dataPackages:
  - dataPath: scripts/data/HeliosBaseline
    importInScratchOrgs: false
  - dataPath: scripts/data/HeliosCrewRefData
    importInScratchOrgs: false

# --- The Training menu ----------------------------------------------------
# Rendered by the VS Code extension as cards on the Welcome page and as menus
# in the Commands panel. This is how a learner runs anything the product does
# not already own a button for.
#
# One menu per level, not one menu for the course. A learner is always inside
# exactly one level, and the commands that level needs are four or five out of
# seven. Splitting them means the menu in front of you only holds things you
# have a reason to click, and the ones that are shared are simply repeated.
# It also lets each entry carry its own level, so "Check my work" and "Reset
# this level" stop by asking which level you are on: they already know.
customCommandsPosition: first
customCommands:
  - id: training-level-1
    label: "Training: Level 1"
    description: Contributor basics - the commands the Level 1 labs ask for
    vscodeIcon: mortar-board
    sldsIcon: utility:education
    welcomeIconClass: cyan
    commands:
      - id: training-l1-init
        label: Set up my training environment
        vscodeIcon: repo-forked
        sldsIcon: utility:merge
        tooltip: Forks the repository, creates your scratch orgs with the Helios app, and wires the pipeline to them
        command: node scripts/training.mjs init
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-1-contributor-basics/1-2-create-your-dev-hub-scratch-orgs-and-pipeline/
      - id: training-l1-status
        label: Where am I?
        vscodeIcon: compass
        sldsIcon: utility:location
        tooltip: Shows the level and lab you reached, and what to do next
        command: node scripts/training.mjs status
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/
      - id: training-l1-check
        label: Check my work
        vscodeIcon: pass
        sldsIcon: utility:check
        tooltip: Verifies the Level 1 lab you just finished and prints your receipt
        command: node scripts/training.mjs check --level 1
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/badges/
      - id: training-l1-claim
        label: Claim my badge
        vscodeIcon: mortar-board
        sldsIcon: utility:favorite
        tooltip: Checks the whole of level 1, then opens the badge claim form with your answers already in it
        command: node scripts/training.mjs claim --level 1
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/badges/
      - id: training-l1-reset
        label: Reset this level
        vscodeIcon: debug-restart
        sldsIcon: utility:refresh
        tooltip: Puts your repository back to the start of Level 1
        command: node scripts/training.mjs reset --level 1
        helpUrl: https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-1-contributor-basics/

  - id: training-level-2
    label: "Training: Level 2"
    description: Contributor advanced - the commands the Level 2 labs ask for
    vscodeIcon: mortar-board
    sldsIcon: utility:education
    welcomeIconClass: indigo
    commands:
      - id: training-l2-init
        label: Set up my training environment
        vscodeIcon: repo-forked
        sldsIcon: utility:merge
        tooltip: Rebuilds a scratch org that expired, with the Helios app, and points the pipeline at it again
