commandsPreDeploy:
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-122a00000001
    label: Remove the Sales User profile from the delta package on production
    type: remove-packagexml-items
    when: pre-deploy
    parameters:
      packageXmlItems:
        - "Profile:Sales User"
    command: ""
    context: all
    includeTargetBranches:
      - main
commandsPostDeploy:
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-122a00000002
    label: Check the Sales User profile assignments with the team leads
    type: manual
    when: post-deploy
    parameters:
      instructions: |
        1. Open **Setup**, type `Users` in the Quick Find box, then open **Users**.
        2. Filter the list on **Profile** = `Sales User` and export it.
        3. With the sales team leads, check that no user lost an access after the profile minimization.
        4. For each user who did, open their record and assign the `CRM_Sales_User` permission set.
        5. Check: every user of the list is confirmed by their lead. If nobody lost an access, there is nothing to do: tick the box anyway.
    command: ""
    context: process-deployment-only
