commandsPreDeploy:
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000001
    label: Check org limits before the deployment
    type: command
    when: pre-deploy
    command: sf hardis:org:monitor:limits
    context: all
    allowFailure: true
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000002
    label: Load the account segments reference data
    type: data
    when: pre-deploy
    parameters:
      sfdmuProject: ProjectsRefsUpsert
    command: sf hardis:org:data:import --path scripts/data/ProjectsRefsUpsert
    context: process-deployment-only
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000003
    label: Remove profiles from the delta package
    type: remove-packagexml-items
    when: pre-deploy
    parameters:
      packageXmlItems:
        - "Profile:*"
        - "CustomLabel:Account_Hierarchy_Help"
    command: ""
    context: check-deployment-only
commandsPostDeploy:
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000004
    label: Assign the CRM_Manager permission set to admins
    type: apex
    when: post-deploy
    parameters:
      apexScript: scripts/apex/assign-crm-manager.apex
    command: ""
    context: process-deployment-only
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000005
    label: Schedule the account hierarchy sync batch
    type: schedule-batch
    when: post-deploy
    parameters:
      className: AccountHierarchySyncBatch
      cronExpression: 0 0 3 * * ?
      jobName: Account Hierarchy Sync
    command: ""
    context: process-deployment-only
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000006
    label: Publish the Customer Portal community
    type: publish-community
    when: post-deploy
    parameters:
      communityName: Customer Portal
    command: ""
    context: process-deployment-only
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000007
    label: Activate the account hierarchy sharing rule in Setup
    type: manual
    when: post-deploy
    parameters:
      instructions: |
        1. Open **Setup**, type `Sharing Settings` in the Quick Find box, then open **Sharing Settings**.
        2. In **Account Sharing Rules**, find `Account_Hierarchy_Read` and click **Edit**.
        3. Set **Share with** to the public group `Sales Team`, and **Account Access** to `Read Only`.
        4. Click **Save**, then confirm the sharing recalculation.
        5. Check: the rule is listed with `Sales Team` / `Read Only`. If it was already the case, there is nothing to do: tick the box anyway.
    command: ""
    context: process-deployment-only
  # Target orgs examples: the ERP is only connected to the uat and production
  # orgs, and the agent sample records must never reach production
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000008
    label: Enable the ERP integration
    type: command
    when: post-deploy
    command: >-
      sf data update record --sobject Integration_Setting__c --where "Name='ERP'" --values "IsActive__c=true" --json
    context: process-deployment-only
    includeTargetBranches:
      - uat
      - main
  - id: 6f0b2b1e-1c9a-4e0d-9d2a-128a00000009
    label: Upsert the sample records used to test the agents
    type: apex
    when: post-deploy
    parameters:
      apexScript: scripts/apex/upsert-agent-sample-data.apex
    command: ""
    context: process-deployment-only
    excludeTargetBranches:
      - main
