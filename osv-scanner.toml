# mermaid 11.15.0 - the five advisories below are fixed only in 11.16.1, and the vulnerable code is
# mermaid's own, so there is no sub-package to pin through resolutions. 11.16.x cannot be adopted: it
# regresses the DevOps Pipeline cluster layout (the Salesforce Orgs subgraph loses "direction TB" and the
# deployment links stop at the subgraph border, verified by headless rendering), which is why mermaid is
# pinned to exactly 11.15.0. Shared input analysis: this extension renders exactly one diagram, generated
# by src/utils/pipeline/branchStrategyMermaidBuilder.ts (always "flowchart LR", preceded by our own
# %%{init}%% directive) and passed to the single mermaid.render() call in
# src/webviews/lwc-ui/modules/s/pipeline/pipeline.js; no markdown / mermaid fence rendering exists
# anywhere in the extension, so no third-party diagram source is ever parsed.

[[IgnoredVulns]]
id = "GHSA-6x64-9x62-f2gx"
ignoreUntil = 2026-11-16
reason = "CVE-2026-71436, DoS in the mermaid XY Charts diagram. Not reachable: the only diagram type this extension ever emits is 'flowchart LR', generated by src/utils/pipeline/branchStrategyMermaidBuilder.ts, and the diagram header line is ours, so the XY Charts parser is never entered. Fixed only in mermaid 11.16.1, which is excluded by the pipeline cluster layout regression; the vulnerable code is mermaid's own so no resolution can help. Re-evaluate when mermaid ships a fix for the 11.16 layout regression."

