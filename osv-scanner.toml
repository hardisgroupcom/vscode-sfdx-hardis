reason = "CVE-2026-71439, DoS via the 'ticks' option of the mermaid Radar diagram. Not reachable, same proof as GHSA-6x64-9x62-f2gx: only 'flowchart LR' is ever generated (src/utils/pipeline/branchStrategyMermaidBuilder.ts), so the Radar parser is never entered. Fixed only in mermaid 11.16.1, which is excluded by the pipeline cluster layout regression. Re-evaluate when mermaid ships a fix for the 11.16 layout regression."

