[[IgnoredVulns]]
id = "GHSA-c4c3-pg64-4m4v"
ignoreUntil = 2026-11-16
reason = "CVE-2026-71438, prototype pollution through the mermaid config APIs. Not reachable: mermaid.initialize() is called exactly once, in src/webviews/lwc-ui-panel.ts, with a literal config object whose only variable parts are two theme colors picked from a hardcoded light/dark table. No user, workspace or remote data ever reaches a mermaid config API. Fixed only in mermaid 11.16.1, which is excluded by the pipeline cluster layout regression. Re-evaluate when mermaid ships a fix for the 11.16 layout regression."

[[IgnoredVulns]]
id = "GHSA-3rrr-jr9j-h3q3"
ignoreUntil = 2026-11-16
reason = "CVE-2026-71437, prototype pollution reachable from mermaid diagram input. Accepted risk, NOT claimed unreachable: the diagram structure is generated by us, but node labels embed branch names and org aliases verbatim (src/utils/pipeline/branchStrategyMermaidBuilder.ts interpolates label into the node line), and for open pull requests the source branch name comes from the git provider, so on a public repository a fork PR author influences part of the diagram text. Accepted because exploitation requires the developer to open the DevOps Pipeline panel on a repository with hostile PR branch names, the panel is a local read-only webview, and the diagram type line plus the %%{init}%% directive are emitted by us rather than by the input. Fixed only in mermaid 11.16.1, which is excluded by the pipeline cluster layout regression, and the vulnerable code is mermaid's own so no resolution can help. Re-evaluate when mermaid ships a fix for the 11.16 layout regression."

[[IgnoredVulns]]
id = "GHSA-2v8p-3f2j-5mp7"
ignoreUntil = 2026-11-16
reason = "CVE-2026-50159, CSS injection through mermaid diagram input. Accepted risk, NOT claimed unreachable - same input analysis as GHSA-3rrr-jr9j-h3q3: branch names and org aliases are interpolated raw into node labels, and mermaid runs with securityLevel 'loose' (required for the clickable pull request links carried in edge labels). Accepted because the impact is bounded to restyling the local Pipeline webview: CSS cannot execute script, and the panel renders no credentials, tokens or org access data. Fixed only in mermaid 11.16.1, which is excluded by the pipeline cluster layout regression. Re-evaluate when mermaid ships a fix for the 11.16 layout regression."
