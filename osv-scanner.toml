# glob and minimatch: the copy bundled in the extension (our direct glob dependency, used by
# src/utils/orgConfigUtils.ts) is upgraded to glob 14 / minimatch 11, which fix both advisories below.
# The copies left are held by build and test tools through major-version ranges: @vscode/vsce
# (glob ^13 / ^11, minimatch ^10 / ^3, also through ovsx), mocha (glob ^10, minimatch ^9), eslint,
# @eslint/config-array and @typescript-eslint/typescript-estree (minimatch ^10). Forcing glob 14 or
# minimatch 11 onto them is not safe: minimatch 11 removes makeRe(), the AST class and changes how
# empty path portions match, and minimatch 3 to 11 also changes the export shape. None of these tools
# is bundled in the extension, and they only ever see patterns written in our own config files.

