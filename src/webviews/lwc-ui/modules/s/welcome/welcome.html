<template>
    <div class="slds-scope blue-back welcome-root" data-theme={colorTheme} data-contrast={colorContrast}>
        <!-- Hero band: brand wordmark + toolbar -->
        <div class="welcome-hero">
            <div class="welcome-hero-bg" aria-hidden="true">
                <div class="welcome-hero-mark">
                    <s-cloudity-logo></s-cloudity-logo>
                </div>
            </div>
            <div class="welcome-container">
                <div class="welcome-toolbar">
                    <lightning-button
                        variant="neutral"
                        class={dependenciesButtonClass}
                        label={dependenciesButtonLabel}
                        icon-name={dependenciesButtonIcon}
                        onclick={navigateToSetup}
                        title={i18n.openSetup}
                        disabled={dependenciesButtonDisabled}
                    ></lightning-button>
                    <div class="welcome-toolbar-right">
                        <lightning-input
                            type="toggle"
                            label={i18n.showAtStartup}
                            name="showWelcomeAtStartup"
                            checked={showWelcomeAtStartup}
                            onchange={handleWelcomeSettingChange}
                            class="welcome-toggle"
                            message-toggle-active=""
                            message-toggle-inactive=""
                        ></lightning-input>
                        <button class="icon-selector-button welcome-icon-button" title={i18n.searchCommandsTooltip} onclick={navigateToSearchCommands}>
                            <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                        </button>
                        <div class="icon-selector" title={i18n.langSelectTooltip}>
                            <button class="icon-selector-button" onclick={toggleLangDropdown}>
                                <img class="icon-selector-img icon-selector-flag" src={currentLangFlagSrc} alt="">
                            </button>
                            <template lwc:if={langDropdownOpen}>
                                <div class="icon-selector-dropdown">
                                    <template for:each={langOptions} for:item="lang">
                                        <div key={lang.code} class="icon-selector-option" data-lang={lang.code} onclick={handleLangChange}>
                                            <img class="icon-selector-img icon-selector-flag" src={lang.flagSrc} alt="">
                                            <span class="icon-selector-option-label">{lang.label}</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <div class="icon-selector" title={i18n.themeSelectTooltip}>
                            <button class="icon-selector-button" onclick={toggleThemeDropdown}>
                                <img class="icon-selector-img" src={currentThemeIconSrc} alt="">
                            </button>
                            <template lwc:if={themeDropdownOpen}>
                                <div class="icon-selector-dropdown">
                                    <template for:each={themeOptions} for:item="themeOption">
                                        <div key={themeOption.code} class="icon-selector-option" data-theme={themeOption.code} onclick={handleThemeChange}>
                                            <img class="icon-selector-img" src={themeOption.iconSrc} alt="">
                                            <span class="icon-selector-option-label">{themeOption.label}</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <button class="icon-selector-button welcome-icon-button" title={i18n.extensionSettings} onclick={navigateToExtensionConfig}>
                            <lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </div>

                <div class="welcome-hero-main">
                    <div class="welcome-hero-text">
                        <h1 class="welcome-wordmark">
                            <span class="welcome-wordmark-brand">sfdx-hardis</span>
                            <span class="welcome-wordmark-suffix">for VS Code</span>
                        </h1>
                        <p class="welcome-tagline">
                            {i18n.welcomeSubtitle}
                            <a class="welcome-cloudity-link" href={websiteUrl} target="_blank" rel="noopener">
                                <s-cloudity-logo class="welcome-cloudity-inline-logo"></s-cloudity-logo>
                                <span>Cloudity</span>
                            </a>
                            &amp;&nbsp;<a href={contributersUrl} target="_blank" rel="noopener">{i18n.friends}</a>
                        </p>
                    </div>
                    <div class="welcome-version">
                        <template lwc:if={versionLabel}>
                            <span class="welcome-version-pill">{versionLabel}</span>
                        </template>
                        <a class="welcome-whatsnew" onclick={openWhatsNew}>{i18n.welcomeWhatsNew} <span class="welcome-arrow">→</span></a>
                    </div>
                </div>

                <template lwc:if={bannerImageUrl}>
                    <div class="welcome-banner" onclick={handleBannerClick}>
                        <img class="welcome-banner-image" src={bannerImageUrl} alt="Banner">
                    </div>
                </template>
            </div>
        </div>

        <div class="welcome-container">
            <!-- Home view -->
            <template lwc:if={isHomeView}>
                <!-- Quick start strip (collapsible, choice is persisted) -->
                <template lwc:if={quickStartCollapsed}>
                    <button class="welcome-quick-collapsed" onclick={toggleQuickStart} title={i18n.welcomeQuickShow}>
                        <span>{i18n.welcomeQuickStartLabel}</span>
                        <lightning-icon icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                    </button>
                </template>
                <template lwc:if={quickStartExpanded}>
                <div class="welcome-quick">
                    <div class="welcome-quick-step">
                        <span class="welcome-quick-num">1</span>
                        <div class="welcome-quick-text">
                            <b>{i18n.welcomeQuick1Title}</b>
                            <span>{i18n.welcomeQuick1Desc}</span>
                        </div>
                        <a class="welcome-quick-action" onclick={handleConnectToOrg}>{i18n.welcomeQuick1Action} <span class="welcome-arrow">→</span></a>
                    </div>
                    <div class="welcome-quick-step">
                        <span class="welcome-quick-num">2</span>
                        <div class="welcome-quick-text">
                            <b>{i18n.welcomeQuick2Title}</b>
                            <span>{i18n.welcomeQuick2Desc}</span>
                        </div>
                        <a class="welcome-quick-action" onclick={navigateToSearchCommands}>{i18n.welcomeQuick2Action} <span class="welcome-arrow">→</span></a>
                    </div>
                    <div class="welcome-quick-step">
                        <span class="welcome-quick-num">3</span>
                        <div class="welcome-quick-text">
                            <b>{i18n.welcomeQuick3Title}</b>
                            <span>{i18n.welcomeQuick3Desc}</span>
                        </div>
                        <a class="welcome-quick-action" onclick={openDocumentation}>{i18n.welcomeQuick3Action} <span class="welcome-arrow">→</span></a>
                    </div>
                    <button class="welcome-quick-toggle" onclick={toggleQuickStart} title={i18n.welcomeQuickHide}>
                        <lightning-icon icon-name="utility:chevronup" size="xx-small"></lightning-icon>
                    </button>
                </div>
                </template>

                <!-- Feature groups -->
                <template for:each={featureGroups} for:item="group">
                    <div key={group.id} class={group.groupClass}>
                        <div class="hardis-group-label">{group.label}</div>
                        <div class="hardis-card-grid">
                            <template for:each={group.cards} for:item="card">
                                <div key={card.id}
                                    class={card.cardClass}
                                    data-target={card.target}
                                    data-menu-id={card.menuId}
                                    role="button"
                                    tabindex="0"
                                    onclick={handleCardClick}
                                    onkeydown={handleCardKeydown}>
                                    <div class="hardis-card-head">
                                        <div class={card.tileClass}>
                                            <lightning-icon icon-name={card.icon} size={card.iconSize}></lightning-icon>
                                        </div>
                                        <h3 class="hardis-card-title">{card.title}</h3>
                                    </div>
                                    <p class="hardis-card-desc">{card.description}</p>
                                    <div class="hardis-card-arrow">→</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Footer band: open source + Cloudity -->
                <div class="welcome-footer">
                    <div class="welcome-footer-card">
                        <h4 class="welcome-footer-title">
                            <span class="hardis-tile small green welcome-footer-heart">
                                <lightning-icon icon-name="utility:heart" size="x-small"></lightning-icon>
                            </span>
                            {i18n.openSourceAndFree}
                        </h4>
                        <div class="welcome-badges">
                            <span class="welcome-badge">✓ {i18n.openSourceFull}</span>
                            <span class="welcome-badge">✓ {i18n.completelyFree}</span>
                            <span class="welcome-badge">✓ {i18n.commercialUseAllowed}</span>
                        </div>
                        <p class="welcome-footer-text">{i18n.welcomeOpenSourceText}</p>
                        <div class="welcome-footer-actions">
                            <lightning-button
                                variant="neutral"
                                label={i18n.welcomeStarOnGitHub}
                                icon-name="utility:favorite"
                                onclick={openRepository}
                            ></lightning-button>
                            <lightning-button
                                variant="neutral"
                                label={i18n.welcomeRateOnMarketplace}
                                icon-name="utility:like"
                                onclick={openMarketplace}
                            ></lightning-button>
                        </div>
                    </div>
                    <div class="welcome-footer-card">
                        <a class="welcome-footer-cloudity" href={websiteUrl} target="_blank" rel="noopener">
                            <s-cloudity-logo class="welcome-footer-cloudity-logo"></s-cloudity-logo>
                            <span class="welcome-footer-cloudity-name">
                                Cloudity
                                <small>Connect w/people</small>
                            </span>
                        </a>
                        <p class="welcome-footer-text">{i18n.welcomeCloudityCard}</p>
                        <lightning-button
                            variant="neutral"
                            class="hardis-btn-tinted-blue"
                            label={i18n.contactUs}
                            icon-name="utility:world"
                            onclick={openCloudityServices}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <!-- Custom Menu Commands View -->
            <template lwc:if={isCustomMenuView}>
                <div class="welcome-custom-view-header">
                    <lightning-button
                        variant="neutral"
                        label={i18n.backToHome}
                        icon-name="utility:back"
                        onclick={backToHome}
                    ></lightning-button>
                    <h2 class="welcome-custom-view-title">{activeCustomMenuLabel}</h2>
                </div>
                <div class="hardis-card-grid">
                    <template for:each={activeCustomMenuCommands} for:item="cmd">
                        <div key={cmd.id}
                            class="hardis-card clickable"
                            data-command={cmd.command}
                            role="button"
                            tabindex="0"
                            onclick={executeCustomCommand}
                            onkeydown={handleCardKeydown}>
                            <div class="hardis-card-head">
                                <div class={cmd.welcomeIconClass}>
                                    <lightning-icon icon-name={cmd.sldsIcon} size="x-small"></lightning-icon>
                                </div>
                                <h3 class="hardis-card-title">{cmd.label}</h3>
                            </div>
                            <p class="hardis-card-desc">{cmd.tooltip}</p>
                            <div class="hardis-card-arrow">→</div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Missing-prerequisites modal: Git / sf CLI / Node.js / sfdx-hardis /
             Salesforce Extension Pack entirely missing (guidance for new users) -->
        <template lwc:if={showPrerequisitesModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open welcome-prereq-modal" aria-modal="true">
                <div class="slds-modal__container">
                    <div class="modal-accent-strip"></div>
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.close} onclick={handleDismissPrerequisitesModal}>
                            <lightning-icon icon-name="utility:close" alternative-text={i18n.close} size="small"></lightning-icon>
                            <span class="slds-assistive-text">{i18n.close}</span>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">{i18n.welcomePrereqModalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="welcome-prereq-modal-intro">{i18n.welcomePrereqModalIntro}</p>
                        <ul class="welcome-prereq-list">
                            <template for:each={missingPrerequisiteItems} for:item="item">
                                <li key={item.id} class="welcome-prereq-item">
                                    <lightning-icon icon-name="utility:package" size="x-small"></lightning-icon>
                                    <div class="welcome-prereq-item-body">
                                        <p class="welcome-prereq-item-label"><strong>{item.label}</strong></p>
                                        <p class="welcome-prereq-item-desc">{item.explanation}</p>
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <p class="welcome-prereq-modal-outro">{i18n.welcomePrereqModalOutro}</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="brand" label={i18n.installDependencies} icon-name="utility:setup" onclick={handleOpenSetupFromModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
