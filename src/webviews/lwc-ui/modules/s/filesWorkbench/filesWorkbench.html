<template>
  <div class="slds-scope slds-card blue-back hardis-workbench" data-theme={colorTheme} data-contrast={colorContrast}>
    <!-- Header -->
    <div class="hardis-page-head">
      <div class="hardis-tile featured amber">
        <lightning-icon icon-name="utility:file" alternative-text={i18n.filesLabel} size="medium"></lightning-icon>
      </div>
      <div class="hardis-page-head-text">
        <h1 class="hardis-page-title">{i18n.filesWorkbenchTitle}</h1>
        <p class="hardis-page-subtitle">{i18n.filesWorkbenchDesc}</p>
      </div>
      <div class="hardis-page-head-actions">
        <lightning-button class="hardis-btn-tinted-blue"
          variant="neutral"
          label={i18n.createWorkspaceLabel}
          title={i18n.createWorkspaceTooltip}
          icon-name="utility:add"
          onclick={handleCreateWorkspace}
        ></lightning-button>
      </div>
    </div>

    <!-- Panel-level three-state body switch -->
    <template if:true={isLoadingState}>
      <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
        <lightning-spinner alternative-text={i18n.loadingLabel} size="medium"></lightning-spinner>
      </div>
    </template>
    <template if:true={hasError}>
      <div class="slds-text-align_center slds-p-around_large">
        <p>{i18n.featureLoadFailed}</p>
        <p class="slds-text-color_weak slds-text-body_small slds-m-top_small">{loadError}</p>
        <div class="slds-m-top_medium"><lightning-button label={i18n.tryAgainLabel} onclick={handleRetry}></lightning-button></div>
      </div>
    </template>
    <template if:true={isReady}>

    <!-- Loading State -->
    <template if:true={isLoading}>
      <div class="hardis-panel-body">
        <div class="slds-text-align_center slds-p-around_large">
          <lightning-spinner alternative-text={i18n.loadingWorkspaces} size="medium"></lightning-spinner>
          <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">{i18n.loadingWorkspaces}</p>
        </div>
      </div>
    </template>

    <!-- No Workspaces State -->
    <template if:false={isLoading}>
      <template if:false={hasWorkspaces}>
        <div class="hardis-panel-body">
          <div class="hardis-empty">
            <div class="hardis-tile featured amber">
              <lightning-icon icon-name="utility:file" size="small"></lightning-icon>
            </div>
            <h3 class="hardis-empty-title">{i18n.noWorkspacesFound}</h3>
            <p class="hardis-empty-desc">{i18n.noWorkspacesFoundDesc}</p>
            <div class="hardis-empty-actions">
              <lightning-button
                variant="neutral"
                label={i18n.createFirstWorkspace}
                class="hardis-btn-tinted-blue"
                onclick={handleCreateWorkspace}
              ></lightning-button>
            </div>
          </div>
        </div>
      </template>
    </template>

    <!-- Workspaces List -->
    <template if:false={isLoading}>
      <template if:true={hasWorkspaces}>
        <div class="hardis-split">
          <!-- Left: Workspaces List -->
          <div class="hardis-panel-body hardis-split-rail">
            <div class="hardis-group-label">
              {i18n.availableWorkspacesTitle}
              <span class="hardis-count-chip">{workspacesCount}</span>
              <div class="hardis-group-actions">
                <s-multiline-helptext content={i18n.availableWorkspacesHelp}></s-multiline-helptext>
              </div>
            </div>
            <div class="hardis-card-grid single-column">
              <template for:each={workspacesForDisplay} for:item="workspace">
                <div
                  key={workspace.path}
                  class={workspace.cardClass}
                  role="button"
                  tabindex="0"
                  aria-pressed={workspace.isSelected}
                  data-path={workspace.path}
                  onclick={handleWorkspaceSelect}
                  onkeydown={handleCardKeydown}
                >
                  <div class="hardis-card-head">
                    <div class="hardis-tile small amber">
                      <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                    </div>
                    <h3 class="hardis-card-title">{workspace.label}</h3>
                  </div>
                  <p class="hardis-card-desc">{workspace.name}</p>
                </div>
              </template>
            </div>
          </div>

          <!-- Right: Selected Workspace -->
          <div class="hardis-panel-body hardis-split-main">
            <template if:true={selectedWorkspace}>
              <div class="hardis-page-head flush">
                <div class="hardis-page-head-text">
                  <h2 class="hardis-page-title">{selectedWorkspace.label}</h2>
                  <p class="hardis-page-subtitle">{selectedWorkspace.name}</p>
                </div>
                <div class="hardis-page-head-actions">
                  <template if:true={showLargeActions}>
                    <lightning-button class="hardis-btn-tinted-blue"
                      variant="neutral"
                      label={i18n.exportFilesLabel}
                      title={i18n.exportFilesTooltip}
                      icon-name="utility:download"
                      icon-position="left"
                      onclick={handleExportFiles}
                    ></lightning-button>
                    <lightning-button class="hardis-btn-tinted-blue"
                      variant="neutral"
                      label={i18n.importFilesLabel}
                      title={i18n.importFilesTooltip}
                      icon-name="utility:upload"
                      icon-position="left"
                      onclick={handleImportFiles}
                    ></lightning-button>
                  </template>
                  <template if:false={showLargeActions}>
                    <lightning-button-menu
                      alternative-text={i18n.workspaceActionsMenu}
                      menu-alignment="right"
                      variant="border-filled"
                      icon-name="utility:down"
                    >
                      <lightning-menu-item
                        value="export"
                        label={i18n.exportFilesMenu}
                        icon-name="utility:download"
                        onclick={handleExportFiles}
                      ></lightning-menu-item>
                      <lightning-menu-item
                        value="import"
                        label={i18n.importFilesMenu}
                        icon-name="utility:upload"
                        onclick={handleImportFiles}
                      ></lightning-menu-item>
                    </lightning-button-menu>
                  </template>
                </div>
              </div>

              <!-- Section: Configuration Summary -->
              <div class="hardis-group-label">
                {i18n.configSummaryTitle}
                <div class="hardis-group-actions">
                  <lightning-button
                    variant="neutral"
                    label={i18n.openFolderInExplorer}
                    title={i18n.clickToOpenFolder}
                    icon-name="utility:open_folder"
                    onclick={handleOpenFolder}
                  ></lightning-button>
                  <lightning-button
                    variant="neutral"
                    label={i18n.editLabel}
                    title={i18n.editWorkspaceTooltip}
                    icon-name="utility:edit"
                    data-path={selectedWorkspace.path}
                    onclick={handleEditWorkspace}
                  ></lightning-button>
                  <lightning-button
                    variant="neutral"
                    class="hardis-btn-tinted-red"
                    label={i18n.dwbDeleteWorkspace}
                    title={i18n.deleteWorkspaceTooltip}
                    icon-name="utility:delete"
                    data-path={selectedWorkspace.path}
                    onclick={handleDeleteWorkspace}
                  ></lightning-button>
                </div>
              </div>
              <div class="hardis-prop-grid">
                <div class="hardis-prop">
                  <div class="hardis-prop-key">{i18n.fileTypesField}</div>
                  <div class="hardis-prop-value">{selectedWorkspace.fileTypes}</div>
                </div>
                <div class="hardis-prop">
                  <div class="hardis-prop-key">{i18n.pathLabel}</div>
                  <div class="hardis-prop-value mono">{selectedWorkspace.path}</div>
                </div>
                <template if:true={selectedWorkspaceHasDescription}>
                  <div class="hardis-prop">
                    <div class="hardis-prop-key">{i18n.descriptionField}</div>
                    <div class="hardis-prop-value">{selectedWorkspace.description}</div>
                  </div>
                </template>
                <div class="hardis-prop">
                  <div class="hardis-prop-key">{i18n.soqlQueryField}</div>
                  <div class="hardis-prop-value mono">{selectedWorkspace.soqlQuery}</div>
                </div>
                <div class="hardis-prop">
                  <div class="hardis-prop-key">{i18n.minFileSizeField}</div>
                  <div class="hardis-prop-value">{selectedWorkspace.fileSizeMin}</div>
                </div>
                <div class="hardis-prop">
                  <div class="hardis-prop-key">{i18n.folderFieldLabel}</div>
                  <div class="hardis-prop-value">{selectedWorkspace.outputFolderNameField}</div>
                </div>
                <div class="hardis-prop">
                  <div class="hardis-prop-key">{i18n.fileNameFormatField}</div>
                  <div class="hardis-prop-value">{selectedWorkspace.outputFileNameFormat}</div>
                </div>
              </div>
              <div class="hardis-chip-row">
                <span class="hardis-chip" title={i18n.overwriteParentRecordsField}>
                  {i18n.overwriteParentRecordsField} {selectedOverwriteParentRecordsLabel}
                </span>
                <span class="hardis-chip" title={i18n.overwriteFilesField}>
                  {i18n.overwriteFilesField} {selectedOverwriteFilesLabel}
                </span>
                <template if:true={selectedWorkspace.exportedFilesCount}>
                  <button
                    class="hardis-chip hardis-chip-link"
                    onclick={handleOpenFolder}
                    title={i18n.clickToOpenFolder}
                  >{exportedFilesCountLabel}</button>
                </template>
              </div>
            </template>

            <template if:false={selectedWorkspace}>
              <div class="hardis-empty">
                <div class="hardis-tile featured amber">
                  <lightning-icon icon-name="utility:touch_action" size="small"></lightning-icon>
                </div>
                <h3 class="hardis-empty-title">{i18n.selectAWorkspace}</h3>
                <p class="hardis-empty-desc">{i18n.selectWorkspaceDesc}</p>
              </div>
            </template>
          </div>
        </div>
      </template>
    </template>
    </template><!-- end isReady -->
  </div>

    <!-- Create/Edit Workspace Modal -->
    <template if:true={showCreateWorkspace}>
      <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          <div class="modal-accent-strip"></div>
          <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.closeLabel} onclick={handleCancel}>
              <lightning-icon icon-name="utility:close" alternative-text={i18n.closeLabel} size="small"></lightning-icon>
              <span class="slds-assistive-text">{i18n.closeLabel}</span>
            </button>
            <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
            <!-- Template selector - only shown when creating a new workspace -->
            <template if:false={isEditMode}>
              <div class="slds-form-element slds-m-bottom_medium">
                <label class="slds-form-element__label" for="workspace-template">
                  {i18n.workspaceTemplateLabel}
                  <s-multiline-helptext content={i18n.workspaceTemplateHelp}></s-multiline-helptext>
                </label>
                <div class="slds-form-element__control slds-grid slds-grid_vertical-align-center">
                  <lightning-combobox
                    variant="label-hidden"
                    name="workspace-template"
                    value={selectedTemplateUrl}
                    options={templateOptions}
                    disabled={isLoadingTemplates}
                    onchange={handleTemplateChange}
                    class="slds-grow"
                  ></lightning-combobox>
                  <template if:true={isLoadingTemplates}>
                    <lightning-spinner alternative-text={i18n.workspaceTemplateLoading} size="small" class="slds-m-left_small"></lightning-spinner>
                  </template>
                </div>
              </div>
            </template>

            <!-- Basic Information -->
            <div class="slds-form-element slds-m-bottom_medium">
              <label class="slds-form-element__label" for="workspace-name">
                <abbr class="slds-required" title={i18n.requiredField}>* </abbr>{i18n.workspaceNameInputLabel}
                <s-multiline-helptext content={i18n.workspaceNameInputHelp}></s-multiline-helptext>
              </label>
              <div class="slds-form-element__control">
                <lightning-input
                  variant="label-hidden"
                  type="text"
                  name="workspace-name"
                  placeholder={i18n.workspaceNameInputPlaceholder}
                  value={newWorkspace.name}
                  onchange={handleNameChange}
                  required
                ></lightning-input>
              </div>
            </div>

            <div class="slds-form-element slds-m-bottom_medium">
              <label class="slds-form-element__label" for="workspace-label">
                <abbr class="slds-required" title={i18n.requiredField}>* </abbr>{i18n.displayLabelField}
                <s-multiline-helptext content={i18n.displayLabelHelp}></s-multiline-helptext>
              </label>
              <div class="slds-form-element__control">
                <lightning-input
                  variant="label-hidden"
                  type="text"
                  name="workspace-label"
                  placeholder={i18n.displayLabelPlaceholder}
                  value={newWorkspace.label}
                  onchange={handleLabelChange}
                  required
                ></lightning-input>
              </div>
            </div>

            <div class="slds-form-element slds-m-bottom_medium">
              <label class="slds-form-element__label" for="workspace-description">
                {i18n.descriptionFieldLabel}
                <s-multiline-helptext content={i18n.descriptionFieldHelp}></s-multiline-helptext>
              </label>
              <div class="slds-form-element__control">
                <lightning-textarea
                  variant="label-hidden"
                  name="workspace-description"
                  placeholder={i18n.descriptionFieldPlaceholder}
                  value={newWorkspace.description}
                  onchange={handleDescriptionChange}
                ></lightning-textarea>
              </div>
            </div>

            <!-- Configuration -->
            <div class="slds-form-element slds-m-bottom_medium">
              <label class="slds-form-element__label" for="soql-query">
                <abbr class="slds-required" title={i18n.requiredField}>* </abbr>{i18n.soqlQueryInputLabel}
                <s-multiline-helptext content={i18n.soqlQueryInputHelp}></s-multiline-helptext>
              </label>
              <div class="slds-form-element__control">
                <lightning-textarea
                  variant="label-hidden"
                  name="soql-query"
                  placeholder="SELECT Id,Name FROM Opportunity"
                  value={newWorkspace.soqlQuery}
                  onchange={handleSoqlQueryChange}
                  required
                ></lightning-textarea>
              </div>
            </div>

            <div class="slds-grid slds-gutters">
              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element slds-m-bottom_medium">
                  <label class="slds-form-element__label" for="file-types">
                    {i18n.fileTypesInputLabel}
                    <s-multiline-helptext content={i18n.fileTypesInputHelp}></s-multiline-helptext>
                  </label>
                  <div class="slds-form-element__control">
                    <lightning-combobox
                      variant="label-hidden"
                      name="file-types"
                      value={newWorkspace.fileTypes}
                      options={fileTypesOptions}
                      onchange={handleFileTypesChange}
                    ></lightning-combobox>
                  </div>
                </div>
              </div>

              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element slds-m-bottom_medium">
                  <label class="slds-form-element__label" for="file-size-min">
                    {i18n.minFileSizeInputLabel}
                    <s-multiline-helptext content={i18n.minFileSizeInputHelp}></s-multiline-helptext>
                  </label>
                  <div class="slds-form-element__control">
                    <lightning-input
                      variant="label-hidden"
                      type="number"
                      name="file-size-min"
                      placeholder="0"
                      min="0"
                      value={newWorkspace.fileSizeMin}
                      onchange={handleFileSizeMinChange}
                    ></lightning-input>
                  </div>
                </div>
              </div>
            </div>

            <div class="slds-grid slds-gutters">
              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element slds-m-bottom_medium">
                  <label class="slds-form-element__label" for="folder-field">
                    {i18n.folderNameFieldLabel}
                    <s-multiline-helptext content={i18n.folderNameFieldHelp}></s-multiline-helptext>
                  </label>
                  <div class="slds-form-element__control">
                    <lightning-input
                      variant="label-hidden"
                      type="text"
                      name="folder-field"
                      placeholder="Name"
                      value={newWorkspace.outputFolderNameField}
                      onchange={handleOutputFolderNameFieldChange}
                    ></lightning-input>
                  </div>
                </div>
              </div>

              <div class="slds-col slds-size_1-of-2">
                <!-- Empty column for layout balance -->
              </div>
            </div>

            <div class="slds-form-element slds-m-bottom_medium">
              <label class="slds-form-element__label" for="file-name-format">
                {i18n.fileNameFormatLabel}
                <s-multiline-helptext content={i18n.fileNameFormatHelp}></s-multiline-helptext>
              </label>
              <div class="slds-form-element__control">
                <lightning-combobox
                  variant="label-hidden"
                  name="file-name-format"
                  value={newWorkspace.outputFileNameFormat}
                  options={fileNameFormatOptions}
                  onchange={handleOutputFileNameFormatChange}
                ></lightning-combobox>
              </div>
            </div>

            <!-- Overwrite Options -->
            <div class="slds-form-element slds-m-bottom_medium">
              <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <lightning-input
                  type="toggle"
                  name="overwrite-parent-records"
                  label={i18n.overwriteParentRecordsLabel}
                  checked={newWorkspace.overwriteParentRecords}
                  onchange={handleOverwriteParentRecordsChange}
                  class="slds-no-flex"
                  message-toggle-active=""
                  message-toggle-inactive=""
                ></lightning-input>
                <s-multiline-helptext content={i18n.overwriteParentRecordsHelp} class="slds-m-left_small"></s-multiline-helptext>
              </div>
            </div>

            <div class="slds-form-element slds-m-bottom_medium">
              <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <lightning-input
                  type="toggle"
                  name="overwrite-files"
                  label={i18n.overwriteExistingFilesLabel}
                  checked={newWorkspace.overwriteFiles}
                  onchange={handleOverwriteFilesChange}
                  class="slds-no-flex"
                  message-toggle-active=""
                  message-toggle-inactive=""
                ></lightning-input>
                <s-multiline-helptext content={i18n.overwriteExistingFilesHelp} class="slds-m-left_small"></s-multiline-helptext>
              </div>
            </div>
          </div>
          <footer class="slds-modal__footer">
            <lightning-button
              variant="neutral"
              label={i18n.cancelLabel}
              onclick={handleCancel}
            ></lightning-button>
            <lightning-button class="hardis-btn-tinted-blue"
              variant="neutral"
              label={saveButtonLabel}
              disabled={saveButtonDisabled}
              onclick={handleSave}
            ></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
