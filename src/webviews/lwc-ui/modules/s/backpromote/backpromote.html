<template>
  <div class="slds-scope blue-back bp-root" data-theme={colorTheme} data-contrast={colorContrast}>
    <div class="hardis-page-head">
      <div class="hardis-tile featured backpromote-action">
        <lightning-icon icon-name="utility:merge" size="medium"></lightning-icon>
      </div>
      <div class="hardis-page-head-text">
        <h1 class="hardis-page-title">{i18n.backpromote}</h1>
        <p class="hardis-page-subtitle">{i18n.backpromotePanelSubtitle}</p>
        <template if:true={showPickers}>
          <div class="bp-from">
            <span class="muted">{i18n.backpromoteTargetOrgLabel}</span>
            <lightning-combobox class="bp-parent-picker" label={i18n.backpromoteTargetOrgLabel} variant="label-hidden" options={targetOrgOptions} value={targetOrgValue} onchange={handleTargetOrgChange} disabled={loading}></lightning-combobox>
            <span class="muted">{i18n.backpromoteFromBranch}</span>
            <lightning-combobox class="bp-parent-picker" label={i18n.backpromoteParentBranchLabel} variant="label-hidden" options={parentBranchOptions} value={parentBranchValue} onchange={handleParentBranchChange} disabled={loading}></lightning-combobox>
            <button type="button" class="hardis-textlink" onclick={handleSelectOrg}>{i18n.backpromoteConnectOtherOrg}</button>
          </div>
        </template>
        <template if:true={hasPassedChecks}>
          <div class="hardis-chip-row">
            <template for:each={passedChecks} for:item="check">
              <span key={check.id} class="hardis-pill hardis-status-success" title={check.title}>
                <span class="hardis-pill-dot"></span>{check.label}
              </span>
            </template>
          </div>
        </template>
      </div>
      <div class="hardis-page-head-actions">
        <lightning-button variant="neutral" icon-name="utility:refresh" label={i18n.refreshLabel} onclick={handleRefresh} disabled={loading}></lightning-button>
      </div>
    </div>

    <!-- Setup: the org and the parent branch, before anything is computed -->
    <template if:true={isSetupState}>
      <div class="hardis-panel-body">
        <div class="hardis-empty">
          <div class="hardis-tile featured backpromote-action">
            <lightning-icon icon-name="utility:merge" size="small"></lightning-icon>
          </div>
          <h3 class="hardis-empty-title">{i18n.backpromoteSetupTitle}</h3>
          <p class="hardis-empty-desc">{setupDescription}</p>
          <div class="bp-setup-form">
            <lightning-combobox label={i18n.backpromoteTargetOrgLabel} options={targetOrgOptions} value={targetOrgValue} onchange={handleSetupTargetOrgChange}></lightning-combobox>
            <lightning-combobox label={i18n.backpromoteParentBranchLabel} options={parentBranchOptions} value={parentBranchValue} onchange={handleSetupParentBranchChange}></lightning-combobox>
          </div>
          <div class="hardis-empty-actions">
            <button type="button" class="hardis-textlink" onclick={handleSelectOrg}>{i18n.backpromoteConnectOtherOrg}</button>
            <lightning-button variant="neutral" class="hardis-btn-tinted-blue" icon-name="utility:search" label={i18n.backpromoteComputePlan} onclick={handleComputePlan}></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <!-- Loading: the plan reads git and previews the org -->
    <template if:true={isLoadingState}>
      <div class="hardis-panel-body">
        <div class="hardis-empty">
          <div class="slds-is-relative bp-spinner">
            <lightning-spinner alternative-text={i18n.loadingLabel} size="medium"></lightning-spinner>
          </div>
          <h3 class="hardis-empty-title">{i18n.backpromoteLoadingTitle}</h3>
          <template if:true={hasPlanProgress}>
            <p class="hardis-empty-desc">{planProgressMessage}</p>
            <template if:true={hasPlanProgressPercent}>
              <div class="hardis-progress-track bp-progress-track">
                <div class="hardis-progress-fill active" style={planProgressFillStyle}></div>
              </div>
            </template>
            <ul class="bp-progress-steps">
              <template for:each={planProgressDoneSteps} for:item="step">
                <li key={step.key} class="bp-progress-step">
                  <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                  <span>{step.message}</span>
                </li>
              </template>
            </ul>
          </template>
          <template if:false={hasPlanProgress}>
            <p class="hardis-empty-desc">{i18n.backpromoteLoadingDesc}</p>
          </template>
        </div>
      </div>
    </template>

    <!-- sfdx-hardis does not know the flags of the panel yet -->
    <template if:true={isCliTooOld}>
      <div class="hardis-panel-body">
        <div class="hardis-empty">
          <div class="hardis-tile featured amber">
            <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
          </div>
          <h3 class="hardis-empty-title">{i18n.backpromoteCliTooOldTitle}</h3>
          <p class="hardis-empty-desc">{i18n.backpromoteCliTooOldDesc}</p>
          <div class="hardis-empty-actions">
            <lightning-button variant="neutral" class="hardis-btn-tinted-blue" label={i18n.backpromoteUpdateSfdxHardis} onclick={handleOpenSetup}></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <template if:true={isGenericError}>
      <div class="hardis-panel-body">
        <div class="hardis-empty">
          <div class="hardis-tile featured red">
            <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
          </div>
          <h3 class="hardis-empty-title">{i18n.backpromotePlanErrorTitle}</h3>
          <div class="hardis-note error bp-error-message">
            <p>{planErrorMessage}</p>
          </div>
          <div class="hardis-empty-actions">
            <lightning-button variant="neutral" class="hardis-btn-tinted-blue" label={i18n.tryAgainLabel} onclick={handleRetry}></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <template if:true={isReady}>
      <!-- Failed checks: nothing can be deployed until they pass -->
      <template if:true={hasFailedChecks}>
        <div class="hardis-status-grid single-column bp-block">
          <template for:each={failedChecks} for:item="check">
            <div key={check.id} class="hardis-status-card error">
              <div class="hardis-tile red">
                <lightning-icon icon-name={check.iconName} size="small"></lightning-icon>
              </div>
              <div class="hardis-status-content">
                <h3 class="hardis-status-title">{check.title}</h3>
                <p class="hardis-status-desc">{check.message}</p>
                <template if:true={check.hasDetails}>
                  <ul class="bp-check-details">
                    <template for:each={check.details} for:item="detail">
                      <li key={detail.key}><span class="hardis-branch-chip">{detail.value}</span></li>
                    </template>
                  </ul>
                </template>
                <template if:true={check.hint}>
                  <p class="hardis-status-desc">{check.hint}</p>
                </template>
              </div>
              <template if:true={check.isTargetOrg}>
                <div class="hardis-status-actions">
                  <lightning-button variant="neutral" class="hardis-btn-tinted-blue" label={i18n.backpromoteSelectOrg} onclick={handleSelectOrg}></lightning-button>
                </div>
              </template>
              <template if:true={check.isGitClean}>
                <div class="hardis-status-actions">
                  <lightning-button variant="neutral" label={i18n.backpromoteOpenSourceControl} onclick={handleOpenSourceControl}></lightning-button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <template if:true={isUpToDate}>
        <div class="hardis-panel-body">
          <div class="hardis-empty">
            <div class="hardis-tile featured green">
              <lightning-icon icon-name="utility:check" size="small"></lightning-icon>
            </div>
            <h3 class="hardis-empty-title">{i18n.backpromoteUpToDateTitle}</h3>
            <p class="hardis-empty-desc">{upToDateDescription}</p>
            <div class="hardis-empty-actions">
              <lightning-button variant="neutral" icon-name="utility:refresh" label={i18n.refreshLabel} onclick={handleRefresh}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <!-- A previous backpromote stopped on conflicts: finish the merge -->
      <template if:true={isMergeInProgress}>
        <div class="hardis-panel-body">
          <div class="hardis-status-card warning bp-block">
            <div class="hardis-tile amber">
              <lightning-icon icon-name="utility:merge" size="small"></lightning-icon>
            </div>
            <div class="hardis-status-content">
              <h3 class="hardis-status-title">{i18n.backpromoteMergeInProgressTitle}</h3>
              <p class="hardis-status-desc">{mergeInProgressDescription}</p>
              <div class="bp-list">
                <template for:each={mergeInProgressFiles} for:item="file">
                  <div key={file.path} class="bp-row-line">
                    <span class="hardis-prop-value mono" title={file.path}>{file.name}</span>
                    <span class={file.pillClass}><span class="hardis-pill-dot"></span>{file.label}</span>
                    <button type="button" class="hardis-textlink" data-path={file.path} onclick={handleOpenFile}>{i18n.openFile}</button>
                  </div>
                </template>
              </div>
              <template if:true={blockerLabel}>
                <p class="hardis-status-desc bp-blocker">{blockerLabel}</p>
              </template>
              <template if:true={runStartedNote}>
                <p class="hardis-status-desc bp-blocker">{runStartedNote}</p>
              </template>
            </div>
            <div class="hardis-status-actions">
              <lightning-button variant="neutral" class="hardis-btn-tinted-blue" icon-name="utility:play" label={i18n.backpromoteContinueButton} onclick={handleRunBackpromote} disabled={continueDisabled}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <template if:true={showMain}>
        <div class="hardis-split">
          <!-- Rail: the Pull Requests the merge brings in -->
          <div class="hardis-panel-body hardis-split-rail">
            <div class="hardis-group-label">
              {i18n.pullRequests}
              <span class="muted bp-section-summary">{commitCountLabel}</span>
            </div>
            <template if:true={hasPullRequests}>
              <div class="hardis-option-list bp-list">
                <template for:each={pullRequestRows} for:item="pr">
                  <div key={pr.key} class="hardis-option-row bp-group-row">
                    <span class="hardis-option-main">
                      <template if:true={pr.webUrl}>
                        <button type="button" class="hardis-textlink hardis-option-label" data-url={pr.webUrl} onclick={handleOpenPullRequest}>{pr.label}</button>
                      </template>
                      <template if:false={pr.webUrl}>
                        <span class="hardis-option-label">{pr.label}</span>
                      </template>
                      <span class="hardis-option-desc">{pr.meta}</span>
                    </span>
                  </div>
                </template>
              </div>
            </template>
            <template if:false={hasPullRequests}>
              <p class="hardis-group-desc">{i18n.backpromotePullRequestsNone}</p>
            </template>
            <p class="hardis-group-desc bp-last-run">{i18n.backpromoteMergeDesc}</p>
          </div>

          <!-- Main: what the merge deploys -->
          <div class="hardis-split-main bp-main">
            <div class="hardis-status-grid bp-counters">
              <div class="hardis-status-card info">
                <div class="hardis-tile small cyan">
                  <lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon>
                </div>
                <div class="hardis-status-content">
                  <p class="hardis-status-title bp-counter-value">{counterItemsToDeploy}</p>
                  <p class="hardis-status-desc">{i18n.backpromoteCounterMetadata}</p>
                </div>
              </div>
              <div class={conflictsCounterClass}>
                <div class="hardis-tile small amber">
                  <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                </div>
                <div class="hardis-status-content">
                  <p class="hardis-status-title bp-counter-value">{counterConflicts}</p>
                  <p class="hardis-status-desc">{i18n.backpromoteCounterConflicts}</p>
                </div>
              </div>
              <div class={deletionsCounterClass}>
                <div class="hardis-tile small red">
                  <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                </div>
                <div class="hardis-status-content">
                  <p class="hardis-status-title bp-counter-value">{counterDeletions}</p>
                  <p class="hardis-status-desc">{i18n.backpromoteCounterDeletions}</p>
                </div>
              </div>
              <div class="hardis-status-card">
                <div class="hardis-tile small violet">
                  <lightning-icon icon-name="utility:record_update" size="x-small"></lightning-icon>
                </div>
                <div class="hardis-status-content">
                  <p class="hardis-status-title bp-counter-value">{counterActions}</p>
                  <p class="hardis-status-desc">{i18n.backpromoteCounterActions}</p>
                </div>
              </div>
            </div>

            <template if:true={orgChangesNote}>
              <div class="hardis-note">
                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                <p>{orgChangesNote}</p>
              </div>
            </template>

            <!-- Files changed on both sides -->
            <div class="hardis-panel-body bp-section">
              <button type="button" class="slds-button bp-section-toggle" data-section="conflicts" aria-expanded={isConflictsOpen} onclick={handleToggleSection}>
                <lightning-icon icon-name={conflictsChevron} size="xx-small"></lightning-icon>
                <span class="hardis-pill hardis-status-pending"><span class="hardis-pill-dot"></span>{i18n.backpromoteConflictsSection}</span>
                <span class="muted bp-section-summary">{conflictsSectionSummary}</span>
              </button>
              <template if:true={isConflictsOpen}>
                <div class="bp-section-body">
                  <template if:false={hasConflictRows}>
                    <p class="muted">{i18n.backpromoteConflictsEmpty}</p>
                  </template>
                  <template if:true={hasConflictRows}>
                    <p class="hardis-group-desc">{i18n.backpromoteConflictsDesc}</p>
                    <template for:each={conflictRows} for:item="row">
                      <div key={row.path} class="bp-row">
                        <div class="bp-row-line">
                          <span class="bp-row-name" title={row.path}>{row.name}</span>
                          <template if:true={row.changedInBranch}>
                            <span class="hardis-pill hardis-status-info"><span class="hardis-pill-dot"></span>{i18n.backpromoteChangedInBranch}</span>
                          </template>
                          <template if:true={row.changedInOrg}>
                            <span class="hardis-pill hardis-status-pending"><span class="hardis-pill-dot"></span>{i18n.backpromoteOrgStateChanged}</span>
                          </template>
                          <template for:each={row.items} for:item="item">
                            <span key={item.key} class="hardis-chip">{item.label}</span>
                          </template>
                        </div>
                        <div class="bp-row-line">
                          <button type="button" class="hardis-textlink" data-path={row.path} onclick={handleOpenFile}>{i18n.openFile}</button>
                          <lightning-button-group>
                            <lightning-button variant="neutral" class={row.overwriteButtonClass} label={i18n.backpromoteChoiceOverwrite} title={overwriteTooltip} data-path={row.path} data-choice="overwrite" onclick={handleConflictChoice} disabled={isReadOnly}></lightning-button>
                            <lightning-button variant="neutral" class={row.mergeButtonClass} label={i18n.backpromoteChoiceMerge} title={i18n.backpromoteChoiceMergeTooltip} data-path={row.path} data-choice="merge" onclick={handleConflictChoice} disabled={isReadOnly}></lightning-button>
                            <lightning-button variant="neutral" class={row.keepButtonClass} label={i18n.backpromoteChoiceKeep} title={i18n.backpromoteChoiceKeepTooltip} data-path={row.path} data-choice="keep" onclick={handleConflictChoice} disabled={isReadOnly}></lightning-button>
                          </lightning-button-group>
                        </div>
                      </div>
                    </template>
                  </template>
                </div>
              </template>
            </div>

            <!-- Deletions -->
            <div class="hardis-panel-body bp-section">
              <button type="button" class="slds-button bp-section-toggle" data-section="deletions" aria-expanded={isDeletionsOpen} onclick={handleToggleSection}>
                <lightning-icon icon-name={deletionsChevron} size="xx-small"></lightning-icon>
                <span class="hardis-pill hardis-status-failed"><span class="hardis-pill-dot"></span>{i18n.backpromoteDeletionsSection}</span>
                <span class="muted bp-section-summary">{deletionsSectionSummary}</span>
              </button>
              <template if:true={isDeletionsOpen}>
                <div class="bp-section-body">
                  <template if:true={hasDeletionRows}>
                    <div class="hardis-option-list bp-list">
                      <template for:each={deletionRows} for:item="row">
                        <button key={row.key} type="button" class={row.rowClass} role="checkbox" aria-checked={row.ariaChecked} data-key={row.key} onclick={handleToggleDeletion} disabled={isReadOnly}>
                          <span class="hardis-check">
                            <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                          </span>
                          <span class="hardis-option-main bp-row-line">
                            <span class={row.typePillClass}><span class="hardis-pill-dot"></span>{row.typeLabel}</span>
                            <span class="hardis-option-label bp-row-name">{row.name}</span>
                          </span>
                        </button>
                      </template>
                    </div>
                  </template>
                  <template if:false={hasDeletionRows}>
                    <p class="muted">{i18n.backpromoteDeletionsNone}</p>
                  </template>
                </div>
              </template>
            </div>

            <!-- Deployment actions -->
            <div class="hardis-panel-body bp-section">
              <button type="button" class="slds-button bp-section-toggle" data-section="actions" aria-expanded={isActionsOpen} onclick={handleToggleSection}>
                <lightning-icon icon-name={actionsChevron} size="xx-small"></lightning-icon>
                <span class="hardis-pill hardis-hue-violet"><span class="hardis-pill-dot"></span>{i18n.backpromoteActionsSection}</span>
                <span class="muted bp-section-summary">{actionsSectionSummary}</span>
              </button>
              <template if:true={isActionsOpen}>
                <div class="bp-section-body">
                  <template if:true={hasActionRows}>
                    <div class="hardis-option-list bp-list">
                      <template for:each={actionRows} for:item="row">
                        <button key={row.id} type="button" class={row.rowClass} role="checkbox" aria-checked={row.ariaChecked} data-id={row.id} onclick={handleToggleAction} disabled={isReadOnly}>
                          <span class="hardis-check">
                            <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                          </span>
                          <span class="hardis-option-main">
                            <span class="bp-row-line">
                              <span class={row.whenPillClass}><span class="hardis-pill-dot"></span>{row.whenLabel}</span>
                              <span class="hardis-option-label bp-row-name">{row.label}</span>
                              <template if:true={row.pullRequestLabel}>
                                <span class="hardis-chip">{row.pullRequestLabel}</span>
                              </template>
                            </span>
                            <span class="bp-row-line bp-row-meta">
                              <span class={row.typePillClass}><span class="hardis-pill-dot"></span>{row.typeLabel}</span>
                              <span class="hardis-option-desc">{row.runsAsLabel}</span>
                              <template if:true={row.isManual}>
                                <span class="hardis-pill hardis-status-pending" title={i18n.backpromoteManualStepTooltip}><span class="hardis-pill-dot"></span>{i18n.backpromoteManualStep}</span>
                              </template>
                            </span>
                          </span>
                        </button>
                      </template>
                    </div>
                  </template>
                  <template if:false={hasActionRows}>
                    <p class="muted">{i18n.backpromoteActionsNone}</p>
                  </template>
                </div>
              </template>
            </div>

            <!-- All metadata -->
            <div class="hardis-panel-body bp-section">
              <button type="button" class="slds-button bp-section-toggle" data-section="all" aria-expanded={isAllOpen} onclick={handleToggleSection}>
                <lightning-icon icon-name={allChevron} size="xx-small"></lightning-icon>
                <span class="hardis-pill hardis-status-unknown"><span class="hardis-pill-dot"></span>{i18n.backpromoteAllMetadataSection}</span>
                <span class="muted bp-section-summary">{allMetadataSummary}</span>
              </button>
              <template if:true={isAllOpen}>
                <div class="bp-section-body">
                  <template if:true={hasMetadataRows}>
                    <p class="hardis-group-desc">{i18n.backpromoteAllMetadataDesc}</p>
                    <s-hardis-datatable
                      key-field="key"
                      data={metadataRows}
                      columns={metadataColumns}
                      column-widths-mode="auto"
                      selected-rows={selectedMetadataKeys}
                      hide-checkbox-column={isReadOnly}
                      onrowselection={handleMetadataSelection}
                    ></s-hardis-datatable>
                  </template>
                  <template if:false={hasMetadataRows}>
                    <p class="muted">{i18n.backpromoteNoMetadata}</p>
                  </template>
                </div>
              </template>
            </div>

            <!-- Deploy bar -->
            <div class="hardis-panel-body bp-deploy-bar">
              <div class="bp-deploy-line">
                <div class="bp-deploy-text">
                  <p class="hardis-status-desc">{testsLabel}</p>
                  <template if:true={blockerLabel}>
                    <p class="hardis-status-desc bp-blocker">{blockerLabel}</p>
                  </template>
                  <template if:true={runStartedNote}>
                    <p class="hardis-status-desc bp-blocker">{runStartedNote}</p>
                  </template>
                </div>
                <button type="button" class="hardis-textlink" onclick={handleToggleCommand} disabled={noCommand}>{commandToggleLabel}</button>
                <lightning-button variant="neutral" class="hardis-btn-tinted-blue" icon-name="utility:play" label={runLabel} title={i18n.backpromoteRunTooltip} onclick={handleRunBackpromote} disabled={runDisabled}></lightning-button>
              </div>
              <template if:true={showCommandBlock}>
                <div class="bp-command">
                  <code class="hardis-prop-value mono bp-command-text">{command}</code>
                  <button type="button" class="hardis-textlink" onclick={handleCopyCommand}>{i18n.backpromoteCopyCommand}</button>
                </div>
                <p class="hardis-group-desc">{i18n.backpromoteCommandHint}</p>
              </template>
            </div>
          </div>
        </div>
      </template>
    </template>
  </div>
</template>
