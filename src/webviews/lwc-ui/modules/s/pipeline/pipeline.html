<template>
    <div class="slds-scope blue-back" style="padding: 0.5rem;">
            <!-- Status icon styles moved to pipeline.css (LWC requires CSS in the component bundle) -->
    <div class="hardis-page-head">
        <div class="hardis-tile featured cyan pipeline-brand-tile">
        <button class="slds-button cloudity-title-logo-button" onclick={openCloudityDocs} title={i18n.cloudityWebsite}>
            <s-cloudity-logo class="cloudity-title-logo"></s-cloudity-logo>
        </button>
        </div>
        <div class="hardis-page-head-text pipeline-head-text">
            <h1 class="hardis-page-title">{i18n.devOpsPipelineTitle}</h1>
            <p class="hardis-page-subtitle">{i18n.devOpsPipelineSubtitle}</p>
        </div>
        <div class="hardis-page-head-actions">
                <!-- Provider icon button for Git -->
                <template if:true={gitProviderIconUrl}>
                    <button class="slds-button provider-button" title={connectedLabel} onclick={handleGitConnect}>
                        <img class={gitProviderIconClass} src={gitProviderIconUrl} alt="Git Provider" />
                    </button>
                </template>
                <!-- Provider icon button for Ticketing -->
                <template if:true={ticketProviderIconUrl}>
                    <button class="slds-button provider-button slds-m-right_medium" title={ticketConnectedLabel} onclick={handleTicketConnect}>
                        <img class={ticketProviderIconClass} src={ticketProviderIconUrl} alt="Ticket Provider" />
                    </button>
                </template>

                <template if:true={gitAuthenticated}>
                    <div class="toggle-wrapper">
                        <lightning-input
                            type="toggle"
                            label={i18n.showFeatureBranches}
                            checked={displayFeatureBranches}
                            onchange={handleToggleFeatureBranches}
                            message-toggle-active=""
                            message-toggle-inactive=""
                        ></lightning-input>
                    </div>
                </template>

                <lightning-button-group>
                    <lightning-button-menu
                        alternative-text={i18n.pipelineConfig}
                        icon-name="utility:settings"
                        variant="border-filled"
                        menu-alignment="right"
                    >
                        <lightning-menu-item
                            value="pipelineSettings"
                            label={i18n.pipelineConfig}
                            icon-name="utility:settings"
                            onclick={handleShowPipelineConfig}
                        ></lightning-menu-item>
                        <lightning-menu-item
                            value="addOrg"
                            label={i18n.addConfigureOrg}
                            icon-name="utility:setup"
                            onclick={configureAuth}
                        ></lightning-menu-item>
                        <lightning-menu-item
                            value="doraReport"
                            label={i18n.generateDoraReport}
                            icon-name="utility:chart"
                            onclick={handleGenerateDoraReport}
                        ></lightning-menu-item>
                    </lightning-button-menu>
                    <lightning-button-menu
                        alternative-text={i18n.deploymentPackages}
                        icon-name="utility:package_org"
                        variant="border-filled"
                        menu-alignment="right"
                    >
                        <lightning-menu-item
                            value="packageXml"
                            label={i18n.packageXml}
                            icon-name="utility:upload"
                            onclick={handleShowPackageXml}
                        ></lightning-menu-item>
                        <lightning-menu-item
                            value="noOverwrite"
                            label={i18n.noOverwrite}
                            icon-name="utility:ban"
                            onclick={handleShowNoOverwrite}
                        ></lightning-menu-item>
                        <lightning-menu-item
                            value="destructive"
                            label={i18n.destructiveChanges}
                            icon-name="utility:delete"
                            onclick={handleShowDestructiveChanges}
                        ></lightning-menu-item>
                    </lightning-button-menu>
                    <template if:true={gitAuthenticated}>
                        <lightning-button
                            icon-name="utility:search"
                            title={i18n.pullRequestsExplorer}
                            onclick={handleOpenExplorer}
                        ></lightning-button>
                    </template>
                    <lightning-button
                        icon-name="utility:refresh"
                        title={i18n.refreshPipelineData}
                        onclick={handleRefresh}
                    ></lightning-button>
                    <lightning-button
                        icon-name="utility:help"
                        title={i18n.documentation}
                        onclick={handleOpenPanelDoc}
                    ></lightning-button>
                </lightning-button-group>
        </div>
    </div>

        <!-- Diagram region: fatal error OR mermaid spinner OR diagram content -->
        <template if:true={hasError}>
            <div class="slds-text-align_center slds-p-around_large">
                <p>{i18n.featureLoadFailed}</p>
                <p class="slds-text-color_weak slds-text-body_small slds-m-top_small">{loadError}</p>
                <div class="slds-m-top_medium"><lightning-button label={i18n.tryAgainLabel} onclick={handleRetry}></lightning-button></div>
            </div>
        </template>
        <template if:false={hasError}>
            <template if:true={isMermaidLoading}>
                <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
                    <lightning-spinner alternative-text={i18n.loadingPipelineData} size="medium"></lightning-spinner>
                </div>
            </template>
            <template if:false={isMermaidLoading}>
                <template if:true={pipelineData}>
                    <template if:true={pipelineData.orgs}>
                        <template if:true={pipelineData.orgs.length}>
                            <div class="pipeline-container">
                                <div style="position: relative;">
                                    <!-- Manual refresh: keep the diagram visible with a spinner overlaid on top -->
                                    <template if:true={isMermaidRefreshing}>
                                        <div class="pipeline-loading-overlay"></div>
                                        <lightning-spinner alternative-text={i18n.loadingPipelineData} size="medium"></lightning-spinner>
                                    </template>
                                    <div class="pipeline-diagram-controls">
                                        <lightning-button-group>
                                            <lightning-button-icon
                                                icon-name="utility:zoomin"
                                                variant="border-filled"
                                                alternative-text={i18n.zoomDiagram}
                                                title={i18n.zoomDiagram}
                                                onclick={handleMermaidZoomIn}
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:zoomout"
                                                variant="border-filled"
                                                alternative-text={i18n.unzoomDiagram}
                                                title={i18n.unzoomDiagram}
                                                onclick={handleMermaidZoomOut}
                                                disabled={isMermaidUnzoomed}
                                            ></lightning-button-icon>
                                        </lightning-button-group>
                                    </div>
                                    <div class={mermaidViewportClass} onmousedown={handleMermaidMouseDown} onwheel={handleMermaidWheel}>
                                        <div class="mermaid"></div>
                                    </div>
                                </div>
                                <!-- Diagram legend: edge kinds + CI job statuses -->
                                <div class="pipeline-legend">
                                        <span class="legend-item"><span class="legend-line legend-line-promotion"></span>{i18n.legendPromotion}</span>
                                        <span class="legend-item"><span class="legend-line legend-line-feature"></span>{i18n.legendFeaturePr}</span>
                                        <span class="legend-item"><span class="legend-line legend-line-deploy"></span>{i18n.deployment}</span>
                                        <span class="legend-separator"></span>
                                        <span class="legend-item"><span class="hardis-pill-dot legend-dot hardis-status-success"></span>{i18n.jobStatusSuccess}</span>
                                        <span class="legend-item"><span class="hardis-pill-dot legend-dot hardis-status-running"></span>{i18n.jobStatusRunning}</span>
                                        <span class="legend-item"><span class="hardis-pill-dot legend-dot hardis-status-pending"></span>{i18n.jobStatusPending}</span>
                                        <span class="legend-item"><span class="hardis-pill-dot legend-dot hardis-status-failed"></span>{i18n.jobStatusFailed}</span>
                                        <span class="legend-separator"></span>
                                        <span class="legend-item"><span class="hardis-conflict-glyph">&#9888;</span>{i18n.legendMergeConflicts}</span>
                                </div>
                                <template if:true={error}>
                                    <pre class="mermaid-debug" style="color:#888;font-size:10px;max-height:100px;overflow:auto;"></pre>
                                </template>
                                <template if:true={hasWarnings}>
                                    <div class="hardis-note warning slds-m-top_small">
                                        <div>
                                            <div class="slds-text-title_caps slds-m-bottom_x-small">{i18n.warnings}</div>
                                            <ul class="slds-list_dotted">
                                                <template for:each={warnings} for:item="warning">
                                                    <li key={warning}>{warning}</li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={pipelineData.orgs.length}>
                            <div class="slds-align_absolute-center" style="flex-direction:column;display:flex;align-items:center;padding:2rem;">
                                <div class="slds-text-heading_medium slds-m-bottom_medium">{i18n.noPipelineConfigured}</div>
                                <div class="slds-m-bottom_medium">{i18n.noPipelineConfiguredDescription}</div>
                                <a class="slds-button slds-button_neutral hardis-btn-tinted-blue slds-m-bottom_medium" href="https://sfdx-hardis.cloudity.com/salesforce-devops-home/" target="_blank">{i18n.configureDevOpsPipeline}</a>
                                <a href="https://sfdx-hardis.cloudity.com/salesforce-devops-home/" target="_blank" style="display:block;max-width:600px;width:100%;margin:1.5rem 0;">
                                    <img src="https://sfdx-hardis.cloudity.com/assets/images/devops-comparison.png" alt="DevOps Comparison" style="max-width:600px;width:100%;box-shadow:0 2px 8px #0001;border-radius:8px;" />
                                </a>
                                <div class="slds-m-bottom_medium slds-text-body_regular" style="max-width:600px;text-align:center;">{i18n.pipelineDevOpsComparison}</div>
                            </div>
                        </template>
                    </template>
                </template>
                <template if:true={error}>
                    <p class="slds-text-color_error">{errorLoadingPipelineMsg}</p>
                </template>
            </template>
        </template>

    <!-- Quick Development Actions Card - always rendered so static actions are available immediately -->
    <div class="pipeline-card-spacing">
        <div class="hardis-panel-body">
        <lightning-tabset class="pipeline-tabs">
            <lightning-tab label={i18n.projectContributionWorkflow} value="workflow" icon-name="utility:trail" icon-assistive-text={i18n.projectContributionWorkflow}>
                <div class="hardis-card-grid">
                    <div class="hardis-card clickable" onclick={handleNewUserStory}>
                        <div class="hardis-card-head">
                            <div class="hardis-tile small new-story">
                                <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                            </div>
                            <h3 class="hardis-card-title">{i18n.newUserStory}</h3>
                        </div>
                        <p class="hardis-card-desc">{i18n.newUserStoryDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                    </div>
                    <div class="hardis-card clickable" onclick={handleOpenMetadataRetriever}>
                        <div class="hardis-card-head">
                            <div class="hardis-tile small pull-action">
                                <lightning-icon icon-name="utility:download" size="x-small"></lightning-icon>
                            </div>
                            <h3 class="hardis-card-title">{i18n.commitChanges}</h3>
                        </div>
                        <p class="hardis-card-desc">{i18n.commitChangesDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                    </div>
                    <div class="hardis-card clickable" onclick={handleShowInstalledPackages}>
                        <div class="hardis-card-head">
                            <div class="hardis-tile small package-action">
                                <lightning-icon icon-name="utility:package" size="x-small"></lightning-icon>
                            </div>
                            <h3 class="hardis-card-title">{i18n.managePackages}</h3>
                        </div>
                        <p class="hardis-card-desc">{i18n.managePackagesDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                    </div>
                    <div class="hardis-card clickable" onclick={handleSaveUserStory}>
                        <div class="hardis-card-head">
                            <div class="hardis-tile small save-action">
                                <lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon>
                            </div>
                            <h3 class="hardis-card-title">{i18n.savePublish}</h3>
                        </div>
                        <p class="hardis-card-desc">{i18n.savePublishDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                    </div>
                    <div class={currentPrCardClasses} onclick={handleOpenCurrentPR}>
                        <div class="hardis-card-head">
                            <div class="hardis-tile small pr-action">
                                <lightning-icon icon-name="utility:topic2" size="x-small"></lightning-icon>
                            </div>
                            <h3 class="hardis-card-title">{currentPRCardTitle}</h3>
                        </div>
                        <p class="hardis-card-desc">{currentPRDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                    </div>
                    <template if:true={hasAutoFixPullRequest}>
                        <div class="hardis-card clickable" onclick={handleOpenAutoFixPR}>
                            <div class="hardis-card-head">
                                <div class="hardis-tile small autofix-action">
                                    <lightning-icon icon-name="utility:task" size="x-small"></lightning-icon>
                                </div>
                                <h3 class="hardis-card-title">{autoFixPRCardTitle}</h3>
                            </div>
                            <p class="hardis-card-desc">{autoFixPRDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                        </div>
                    </template>
                    <div class="hardis-card clickable" onclick={handleBackpromote}>
                        <div class="hardis-card-head">
                            <div class="hardis-tile small backpromote-action">
                                <lightning-icon icon-name="utility:merge" size="x-small"></lightning-icon>
                            </div>
                            <h3 class="hardis-card-title">{i18n.backpromote}</h3>
                        </div>
                        <p class="hardis-card-desc">{i18n.backpromoteDescription}</p>
                        <div class="hardis-card-arrow">→</div>
                    </div>
                </div>
            </lightning-tab>
            <lightning-tab label={openPrTabLabel} value="prs" icon-name="utility:topic2" icon-assistive-text={openPrTabLabel}>
                    <template if:true={isPrLoading}>
                        <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
                            <lightning-spinner alternative-text={i18n.loadingLabel} size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={isPrLoading}>
                        <template if:true={gitAuthenticated}>
                            <s-hardis-datatable
                                key-field="id"
                                data={openPullRequests}
                                column-widths-mode="auto"
                                columns={prColumns}
                                hide-checkbox-column
                                onrowaction={handlePRRowAction}
                            ></s-hardis-datatable>
                            <template if:true={prButtonInfo}>
                                <div class="slds-m-top_small slds-align_absolute-center">
                                    <lightning-button class="hardis-btn-tinted-blue"
                                        icon-name="utility:share"
                                        variant="neutral"
                                        label={prButtonInfo.label}
                                        title={prButtonInfo.label}
                                        onclick={openPrPage}
                                    ></lightning-button>
                                </div>
                            </template>
                        </template>
                        <template if:false={gitAuthenticated}>
                            <div class="slds-m-around_small slds-grid slds-grid_align-center">
                                <lightning-button
                                    icon-name={connectedIconName}
                                    variant={connectedVariant}
                                    label={connectedLabel}
                                    title={i18n.connectToGitProvider}
                                    onclick={handleGitConnect}
                                ></lightning-button>
                            </div>
                        </template>
                    </template>
            </lightning-tab>
        </lightning-tabset>
        </div>
    </div>
    </div>

    <!-- PR Modal -->
    <template if:true={showPRModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="modal-accent-strip"></div>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.close} onclick={handleClosePRModal}>
                        <lightning-icon icon-name="utility:close" size="small" alternative-text={i18n.close}></lightning-icon>
                        <span class="slds-assistive-text">{i18n.close}</span>
                    </button>
                    <template if:true={modalHasBack}>
                        <div class="modal-previous">
                            <lightning-button
                                variant="neutral"
                                icon-name="utility:back"
                                label={i18n.prViewPrevious}
                                title={previousTitle}
                                onclick={handleModalPrevious}
                            ></lightning-button>
                        </div>
                        <nav class="modal-breadcrumb" aria-label={i18n.prViewBreadcrumb}>
                            <template for:each={modalBreadcrumb} for:item="crumb">
                                <span key={crumb.key} class="modal-crumb">
                                    <button class="hardis-pr-ref" data-index={crumb.index} title={crumb.title} onclick={handleModalBack}>{crumb.label}</button>
                                    <span class="modal-crumb-sep">/</span>
                                </span>
                            </template>
                        </nav>
                    </template>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        <template if:true={isSinglePRMode}>
                            {modalTitle}
                        </template>
                        <template if:true={showBranchModalTitle}>
                            <span class="modal-title-parts">
                                <span>{modalTitlePrefix}</span>
                                <span class="hardis-branch-chip modal-branch-chip">{modalBranchName}</span>
                                <span class="modal-count-badge">{modalPrCount}</span>
                            </span>
                        </template>
                        <template if:true={showPlainModalTitle}>
                            {modalTitle}
                        </template>
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <!-- Pull Requests explorer: the lookup, then the Pull Request it found -->
                    <template if:true={showExplorerLookup}>
                        <div class="slds-m-bottom_small">
                            <s-pull-request-lookup
                                loaded-pull-requests={lookupLoadedPullRequests}
                                platform-label={repoPlatformLabel}
                                pr-label={prLabel}
                                onsearch={handleLookupSearch}
                                onselect={handleLookupSelect}
                            ></s-pull-request-lookup>
                        </div>
                    </template>
                    <template if:true={showExplorerEmpty}>
                        <div class="hardis-empty">
                            <div class="hardis-tile featured cyan">
                                <lightning-icon icon-name="utility:search" size="medium"></lightning-icon>
                            </div>
                            <div class="hardis-empty-title">{i18n.pullRequestsExplorer}</div>
                            <div class="hardis-empty-desc">{i18n.prExplorerEmptyDesc}</div>
                        </div>
                    </template>
                    <template if:true={prViewLoading}>
                        <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
                            <lightning-spinner alternative-text={i18n.loadingLabel} size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={showModalTabs}>
                    <!-- One Pull Request: what it is, and where it stands in the pipeline -->
                    <template if:true={isSinglePRMode}>
                        <div class="slds-m-bottom_small">
                            <s-pull-request-header
                                pull-request={singlePullRequest}
                                journey={modalJourney}
                                loading={journeyLoading}
                                platform-label={repoPlatformLabel}
                                onopen={handleOpenPullRequestRef}
                            ></s-pull-request-header>
                        </div>
                        <template if:true={showCheckoutBehindNote}>
                            <div class="hardis-note warning slds-m-bottom_small">
                                <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                                <p>{checkoutBehindNote}</p>
                            </div>
                        </template>
                    </template>
                    <!-- Go-lives selector (top branches such as main/prod) -->
                    <template if:true={modalIsTopBranch}>
                        <div class="slds-m-bottom_small">
                            <lightning-combobox
                                label={i18n.goLiveSelectorLabel}
                                value={selectedGoLiveId}
                                placeholder={i18n.goLiveSelectorPlaceholder}
                                options={goLivesComboboxOptions}
                                disabled={isGoLivesComboboxDisabled}
                                onchange={handleGoLiveChange}
                            ></lightning-combobox>
                        </div>
                    </template>
                    <!-- While a selected release is loading, show a spinner in place of the tables -->
                    <template if:true={isLoadingReleaseDetails}>
                        <div class="slds-spinner_container slds-is-relative slds-p-around_large">
                            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                <span class="slds-assistive-text">{i18n.loadingLabel}</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                    </template>
                    <template if:false={isLoadingReleaseDetails}>
                    <lightning-tabset active-tab-value={modalActiveTabValue}>
                        <!-- General tab: the description of one Pull Request -->
                        <template if:true={isSinglePRMode}>
                            <lightning-tab onactive={handleModalTabActive} label={i18n.prGeneralTab} value="general" icon-name="utility:info" icon-assistive-text={i18n.prGeneralTab}>
                                <template if:true={singlePullRequestDescription}>
                                    <s-markdown-view markdown={singlePullRequestDescription}></s-markdown-view>
                                </template>
                                <template if:false={singlePullRequestDescription}>
                                    <div class="slds-align_absolute-center slds-p-around_medium">
                                        <p class="slds-text-color_weak">{noDescriptionLabel}</p>
                                    </div>
                                </template>
                            </lightning-tab>
                        </template>
                        <!-- A promotion, or a merge between two major branches: the Pull Requests it carries -->
                        <template if:true={showCarriedPrTab}>
                            <lightning-tab onactive={handleModalTabActive} label={modalCarriedPrsTabLabel} value="carried" icon-name="utility:topic2" icon-assistive-text={modalCarriedPrsTabLabel}>
                                <s-pull-request-list
                                    pull-requests={modalCarriedPullRequests}
                                    pr-label={prLabel}
                                    onopen={handleOpenPullRequestRef}
                                ></s-pull-request-list>
                            </lightning-tab>
                        </template>
                        <template if:true={showPRTab}>
                            <lightning-tab onactive={handleModalTabActive} label={modalPrsTabLabel} value="prs" icon-name="utility:topic2" icon-assistive-text={modalPrsTabLabel}>
                            <!-- cspell:ignore onvehicles -->
                            <s-pull-request-list
                                pull-requests={modalPrListRows}
                                pr-label={prLabel}
                                selectable={modalPrsSelectable}
                                selected-numbers={modalSelectedPrNumbers}
                                select-help={promotionSelectionHint}
                                show-status={showJobStatusColumn}
                                vehicle-count={modalVehicleCount}
                                vehicles-shown={modalShowPromotionPrs}
                                onopen={handleOpenPullRequestRef}
                                onselect={handleModalPrSelect}
                                onvehicles={handleToggleModalPromotionPrs}
                            ></s-pull-request-list>
                        </lightning-tab>
                        </template>
                        <template if:false={isFeaturePrModal}>
                        <lightning-tab onactive={handleModalTabActive} label={modalTicketsTabLabel} value="tickets" icon-name="utility:link" icon-assistive-text={modalTicketsTabLabel}>
                            <s-ticket-list
                                tickets={modalTickets}
                                details-available={ticketAuthenticated}
                                loading={ticketDetailsLoading}
                                show-pull-requests={showTicketPullRequests}
                                onopen={handleOpenPullRequestRef}
                            ></s-ticket-list>
                        </lightning-tab>
                        <lightning-tab onactive={handleModalTabActive} label={modalActionsTabLabel} value="actions" icon-name="utility:task" icon-assistive-text={modalActionsTabLabel}>
                            <template if:true={showAddActionButton}>
                                <div class="slds-m-bottom_small da-toolbar">
                                    <lightning-button class="hardis-btn-tinted-blue"
                                        variant="neutral"
                                        label={i18n.addNewAction}
                                        icon-name="utility:add"
                                        onclick={handleAddNewAction}
                                    ></lightning-button>
                                </div>
                            </template>
                            <template if:true={modalActionsFromBranch}>
                                <div class="hardis-note slds-m-bottom_small">{actionsFromBranchNote}</div>
                            </template>
                            <template if:true={showMajorPrActionsHint}>
                                <div class="hardis-note slds-m-bottom_small">{majorPrActionsHint}</div>
                            </template>
                            <template if:true={modalActions.length}>
                                <!-- The switch between the status in the branch and the next promotion,
                                     and the pills of every Pull Request added up -->
                                <template if:true={showActionsHead}>
                                    <div class="da-actions-head">
                                        <div class="da-head-line">
                                            <template if:true={showPromotionToggle}>
                                                <div class="da-seg" role="group">
                                                    <button class={promotionToggleCurrentClass} aria-pressed={promotionModeOffPressed} onclick={handlePromotionModeOff}>{promotionToggleCurrentLabel}</button>
                                                    <button class={promotionToggleNextClass} aria-pressed={promotionModeOnPressed} onclick={handlePromotionModeOn}>{promotionToggleNextLabel}</button>
                                                </div>
                                            </template>
                                            <template if:true={modalActionTotals.length}>
                                                <div class="da-totals">
                                                    <span class="da-totals-label">{i18n.actionSummaryTotal}</span>
                                                    <template for:each={modalActionTotals} for:item="pill">
                                                        <button type="button" key={pill.key} class="da-status-toggle" data-key={pill.key} aria-pressed={pill.pressed} title={pill.toggleTitle} onclick={handleActionTotalToggle}><span class={pill.pillClass}><span class="hardis-pill-dot"></span>{pill.label}</span></button>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <template if:true={isPromotionModeShown}>
                                            <div class="da-promo-bar">
                                                <template if:true={promotionPullRequest}>
                                                    <span>{i18n.forecastPromotionPr}</span>
                                                    <a href={promotionPullRequest.webUrl} target="_blank" rel="noopener noreferrer">{promotionPullRequest.label}</a>
                                                    <template if:true={promotionPullRequest.jobsLabel}>
                                                        <a class={promotionPullRequest.jobsPillClass} href={promotionPullRequest.jobsUrl} target="_blank" rel="noopener noreferrer"><span class="hardis-pill-dot"></span>{promotionPullRequest.jobsLabel}</a>
                                                    </template>
                                                </template>
                                                <template if:false={promotionPullRequest}>
                                                    <span>{promotionNoPrLabel}</span>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template if:true={everyActionHidden}>
                                    <div class="hardis-note slds-m-bottom_small">{i18n.everyActionHiddenByTotal}</div>
                                </template>
                                <!-- One group per Pull Request: its header says who and what once, its
                                     rows are the actions in the order they run -->
                                <div class="da-groups">
                                    <template for:each={modalActionGroups} for:item="group">
                                        <section key={group.key} class={group.groupClass}>
                                            <template if:true={group.showHeader}>
                                                <header class="da-group-head">
                                                    <span class={group.authorAvatarClass} title={group.authorLabel}>{group.authorInitials}</span>
                                                    <a class="da-group-pr" href={group.prWebUrl} data-pr-number={group.prNumber} onclick={handleActionGroupPrClick}>{group.prLabel}</a>
                                                    <span class="da-group-author">{group.authorLabel}</span>
                                                    <span class="da-group-summary">
                                                        <template for:each={group.summary} for:item="pill">
                                                            <span key={pill.key} class={pill.pillClass}><span class="hardis-pill-dot"></span>{pill.label}</span>
                                                        </template>
                                                    </span>
                                                </header>
                                            </template>
                                            <template for:each={group.rows} for:item="row">
                                                <div key={row.id} class="da-row-wrap">
                                                    <div class="da-row">
                                                        <span class="da-order">{row.order}</span>
                                                        <div class="da-main">
                                                            <button class="da-label" data-row-id={row.id} onclick={handleActionLabelClick} title={i18n.deploymentActionViewDetails}>{row.label}</button>
                                                            <div class="da-meta">
                                                                <span class={row.typePillClass}>
                                                                    <lightning-icon class="hardis-pill-icon" icon-name={row.typeIconName} size="xx-small"></lightning-icon>
                                                                    <span class="hardis-pill-label">{row.type}</span>
                                                                </span>
                                                                <span class={row.whenPillClass}><span class="hardis-pill-dot"></span>{row.when}</span>
                                                                <template if:true={row.statusDetail}>
                                                                    <span class="da-detail">{row.statusDetail}</span>
                                                                </template>
                                                            </div>
                                                        </div>
                                                        <div class="da-status">
                                                            <template if:true={row.showStatus}>
                                                                <button class="da-status-toggle" data-row-id={row.id} onclick={handleActionStatusToggle} title={row.statusToggleTitle} aria-expanded={row.expanded}><span class={row.statusPillClass}><span class="hardis-pill-dot"></span>{row.statusLabel}</span></button>
                                                            </template>
                                                        </div>
                                                        <div class="da-buttons">
                                                            <template for:each={row.inlineButtons} for:item="button">
                                                                <button key={button.name} class={button.className} data-row-id={row.id} data-action-name={button.name} onclick={handleActionInlineButton} disabled={button.busy}><template if:true={button.busy}><span class="da-button-spinner" aria-hidden="true"></span></template>{button.label}</button>
                                                            </template>
                                                            <lightning-button-menu
                                                                icon-size="small"
                                                                menu-alignment="auto"
                                                                alternative-text={i18n.moreOptions}
                                                                title={i18n.moreOptions}
                                                                data-row-id={row.id}
                                                                onselect={handleActionMenuSelect}
                                                            >
                                                                <template for:each={row.menuItems} for:item="item">
                                                                    <lightning-menu-item key={item.name} value={item.name} label={item.label} prefix-icon-name={item.iconName} disabled={item.disabled}></lightning-menu-item>
                                                                </template>
                                                            </lightning-button-menu>
                                                        </div>
                                                    </div>
                                                    <!-- Status of the action in every org of the pipeline, and in the developer orgs -->
                                                    <template if:true={row.expanded}>
                                                        <div class="da-details">
                                                            <template for:each={row.statusDetailLines} for:item="line">
                                                                <div key={line.key} class="da-detail-line">
                                                                    <span class="da-detail-name">{line.name}</span>
                                                                    <span class={line.pillClass}><span class="hardis-pill-dot"></span>{line.statusLabel}</span>
                                                                    <span class="da-detail-date">{line.date}</span>
                                                                    <span class="da-detail-note">
                                                                        <template if:true={line.jobUrl}><a href={line.jobUrl} target="_blank" rel="noopener noreferrer">{line.jobLabel}</a> </template>{line.note}
                                                                    </span>
                                                                    <span class="da-detail-action">
                                                                        <template if:true={line.canMarkDone}>
                                                                            <button class="slds-button slds-button_neutral da-button" data-row-id={row.id} data-branch={line.name} onclick={handleActionDetailMarkDone} disabled={line.busy}><template if:true={line.busy}><span class="da-button-spinner" aria-hidden="true"></span></template>{line.markLabel}</button>
                                                                        </template>
                                                                    </span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </section>
                                    </template>
                                </div>
                            </template>
                            <template if:false={modalActions.length}>
                                <div class="slds-align_absolute-center slds-p-around_medium">
                                    <p class="slds-text-color_weak">{i18n.noActionsFoundInPrs}</p>
                                </div>
                            </template>
                        </lightning-tab>
                        </template>
                            <!-- Apex Tests Tab (only when enabled in .sfdx-hardis.yml) -->
                            <template if:true={showApexTestsTab}>
                                <lightning-tab onactive={handleModalTabActive} label={modalApexTestsTabLabel} value="apexTests" icon-name="utility:bug" icon-assistive-text={modalApexTestsTabLabel}>
                                    <template if:true={showNotOwnPrEditNote}>
                                        <div class="hardis-note warning slds-m-bottom_small">
                                            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                                            <p>{notOwnPrNote}</p>
                                        </div>
                                    </template>
                                    <template if:true={modalActionsFromBranch}>
                                        <div class="hardis-note slds-m-bottom_small">{actionsFromBranchNote}</div>
                                    </template>
                                    <template if:true={canEditApexTestsInModal}>
                                        <template if:true={isApexTestsViewMode}>
                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                                <div class="slds-text-body_small">
                                                    {apexTestsConfiguredForPrMsg}
                                                </div>
                                                <template if:true={canEditApexTestsOfPr}>
                                                    <lightning-button
                                                        variant="neutral"
                                                        label={i18n.edit}
                                                        onclick={handleEditApexTests}
                                                    ></lightning-button>
                                                </template>
                                            </div>

                                            <template if:true={hasSelectedApexTests}>
                                                <s-hardis-datatable
                                                    key-field="id"
                                                    data={apexTestsSelectedRows}
                                                    columns={apexTestsSelectedColumns}
                                                    hide-checkbox-column
                                                    column-widths-mode="auto"
                                                ></s-hardis-datatable>
                                            </template>
                                            <template if:false={hasSelectedApexTests}>
                                                <div class="slds-text-color_weak">{i18n.noApexClassesConfigured}</div>
                                            </template>
                                        </template>

                                        <template if:true={isApexTestsEditMode}>
                                            <div class="slds-m-bottom_small slds-text-body_small">
                                                {i18n.selectApexTestClasses}
                                            </div>
                                            <s-apex-tests-select
                                                available-classes={availableApexTestClasses}
                                                value={deploymentApexTestClasses}
                                                translations={translations}
                                                onchange={handleApexTestsSelectChange}
                                            ></s-apex-tests-select>
                                            <div class="slds-m-top_small">
                                                <lightning-button class="hardis-btn-tinted-blue"
                                                    variant="neutral"
                                                    label={i18n.save}
                                                    onclick={handleSaveApexTests}
                                                ></lightning-button>
                                                <lightning-button
                                                    class="slds-m-left_small"
                                                    variant="neutral"
                                                    label={i18n.cancel}
                                                    onclick={handleCancelApexTestsEdit}
                                                ></lightning-button>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={canEditApexTestsInModal}>
                                        <div class="slds-text-body_regular slds-m-bottom_small">
                                            {readOnlyBranchModeMsg}
                                        </div>
                                        <template if:true={hasApexTestsByLineRows}>
                                            <s-hardis-datatable
                                                key-field="id"
                                                data={apexTestsByLineRows}
                                                columns={apexTestsByLineColumns}
                                                hide-checkbox-column
                                                column-widths-mode="auto"
                                                onrowaction={handleModalPrRowAction}
                                            ></s-hardis-datatable>
                                        </template>
                                        <template if:false={hasApexTestsByLineRows}>
                                            <div class="slds-text-color_weak">{i18n.noApexTestsInBranch}</div>
                                        </template>
                                    </template>
                                </lightning-tab>
                            </template>
                            <!-- Validation, Code Quality (MegaLinter) and Deployment tabs: the comments posted on the Pull Request itself -->
                            <template if:true={showWorkflowsTab}>
                                <lightning-tab onactive={handleModalTabActive} label={i18n.journeyValidation} value="validation" icon-name="utility:search" icon-assistive-text={i18n.journeyValidation}>
                                    <s-workflow-runs
                                        runs={modalValidationRuns}
                                        loading={workflowsLoading}
                                        empty-label={noValidationLabel}
                                    ></s-workflow-runs>
                                </lightning-tab>
                                <lightning-tab onactive={handleModalTabActive} label={i18n.prCodeQualityTab} value="megalinter" icon-name="utility:shield" icon-assistive-text={i18n.prCodeQualityTab}>
                                    <s-workflow-runs
                                        runs={modalMegaLinterRuns}
                                        loading={workflowsLoading}
                                        empty-label={noMegaLinterLabel}
                                    ></s-workflow-runs>
                                </lightning-tab>
                                <lightning-tab onactive={handleModalTabActive} label={i18n.workflowDeploymentNoBranch} value="deployment" icon-name="utility:upload" icon-assistive-text={i18n.workflowDeploymentNoBranch}>
                                    <s-workflow-runs
                                        runs={modalDeploymentRuns}
                                        loading={workflowsLoading}
                                        empty-label={noDeploymentLabel}
                                    ></s-workflow-runs>
                                </lightning-tab>
                            </template>
                    </lightning-tabset>
                    </template>
                    </template>
                </div>
                <footer class="slds-modal__footer hardis-modal-footer">
                    <div class="hardis-modal-footer-actions">
                        <!-- Promotion and release notes buttons belong to a branch window. One Pull Request (or the explorer, or a draft) has none: its way out to the git provider is the Open on button of its header -->
                        <template if:true={showBranchModalTitle}>
                            <template if:true={showCreatePromotionButton}>
                                <lightning-button
                                    class="hardis-btn-tinted-green"
                                    variant="neutral"
                                    label={createPromotionLabel}
                                    title={createPromotionTitle}
                                    icon-name="utility:merge"
                                    icon-position="left"
                                    onclick={handleCreatePromotion}
                                ></lightning-button>
                            </template>
                            <template if:true={showPreviewReleaseNotes}>
                                <lightning-button
                                    class="hardis-btn-tinted-green"
                                    variant="neutral"
                                    label={previewReleaseNotesLabel}
                                    title={previewReleaseNotesTitle}
                                    icon-name="utility:preview"
                                    icon-position="left"
                                    onclick={handlePreviewReleaseNotes}
                                ></lightning-button>
                            </template>
                            <lightning-button
                                class="hardis-btn-tinted-green"
                                variant="neutral"
                                label={generateReleaseNotesLabel}
                                title={generateReleaseNotesTitle}
                                icon-name="utility:document_preview"
                                icon-position="left"
                                onclick={handleGenerateReleaseNotes}
                            ></lightning-button>
                        </template>
                    </div>
                    <div class="hardis-modal-footer-close">
                        <lightning-button variant="neutral" label={i18n.close} onclick={handleClosePRModal}></lightning-button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Deployment Action Modal (nested) -->
    <template if:true={showDeploymentActionModal}>
        <s-deployment-action
            action={currentDeploymentAction}
            is-edit-mode={isDeploymentActionEditMode}
            read-only={modalActionsReadOnly}
            apex-scripts={projectApexScripts}
            custom-functions={customFunctions}
            sfdmu-workspaces={projectSfdmuWorkspaces}
            schedulable-classes={projectSchedulableClasses}
            project-only-schedulable-classes={projectOnlySchedulableClasses}
            schedulable-classes-loading={schedulableClassesLoading}
            batchable-classes={projectBatchableClasses}
            project-only-batchable-classes={projectOnlyBatchableClasses}
            batchable-classes-loading={batchableClassesLoading}
            communities={projectCommunities}
            communities-loading={communitiesLoading}
            major-branches={majorBranchNames}
            parent-translations={translations}
            onclose={handleCloseDeploymentActionModal}
            onedit={handleEditDeploymentAction}
            onloadschedulableclasses={handleLoadSchedulableClasses}
            onloadbatchableclasses={handleLoadBatchableClasses}
            onloadcommunities={handleLoadCommunities}
            onsave={handleSaveDeploymentAction}
        ></s-deployment-action>
    </template>
</template>
