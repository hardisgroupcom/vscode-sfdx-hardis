<template>
    <div class="slds-scope slds-theme_default slds-p-around_medium blue-back">
    <div class="hardis-page-head">
        <div class="hardis-tile featured cyan">
            <lightning-icon icon-name="utility:connected_apps" size="medium"></lightning-icon>
        </div>
        <div class="hardis-page-head-text">
            <h1 class="hardis-page-title">{i18n.salesforceOrgsManager}</h1>
            <p class="hardis-page-subtitle">{i18n.orgsManagerSubtitle}</p>
        </div>
        <div class="hardis-page-head-actions">
            <lightning-input type="toggle" label={i18n.viewAllOrgs} title={i18n.viewAllOrgs} checked={viewAll} onchange={handleViewAllToggle} message-toggle-active="" message-toggle-inactive=""></lightning-input>
            <lightning-button icon-name="utility:refresh" label={i18n.refreshLabel} title={i18n.refreshOrgsListTooltip} onclick={handleRefresh}></lightning-button>
            <lightning-button icon-name="utility:add" label={i18n.addOrg} title={i18n.connectToExistingOrgs} variant="neutral" class="hardis-btn-tinted-blue" onclick={handleConnect}></lightning-button>
            <template if:true={hasRecommended}>
                <lightning-button icon-name="utility:recycle_bin_full" label={i18n.removeRecommendedLabel} variant="neutral" class="hardis-btn-tinted-red" title={i18n.removeRecommendedOrgsTooltip} onclick={handleRemoveRecommended}></lightning-button>
            </template>
            <template if:true={hasSelection}>
                <lightning-button icon-name="utility:delete" label={i18n.forgetSelectedLabel} variant="neutral" class="hardis-btn-tinted-red" title={i18n.forgetSelectedOrgsTooltip} onclick={handleForgetSelected}></lightning-button>
            </template>
        </div>
    </div>
    <div class="hardis-panel-body">
        <div class="slds-m-around_medium">
            <template if:true={isInitialLoading}>
                <div class="slds-text-align_center slds-p-around_large slds-is-relative org-manager-initial-loading">
                    <lightning-spinner alternative-text={i18n.loadingSalesforceOrgsShort} size="medium"></lightning-spinner>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-large">{i18n.loadingSalesforceOrgsShort}</p>
                </div>
            </template>
            <template if:false={isInitialLoading}>
                <div class="slds-is-relative">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text={i18n.loadingSalesforceOrgsShort} size="medium"></lightning-spinner>
                    </template>
                    <s-hardis-datatable
                        key-field="username"
                        data={orgs}
                        column-widths-mode="auto"
                        columns={columns}
                        draft-values={draftValues}
                        oncellchange={handleDraftValuesChange}
                        onsave={handleSaveAliases}
                        oncancel={handleCancelAliasChanges}
                        onrowaction={handleRowAction}
                        onrowselection={handleRowSelection}
                        selected-rows={selectedRowKeys}
                        hide-checkbox-column={hasAliasChanges}
                        class="slds-m-bottom_medium"
                    ></s-hardis-datatable>
                </div>
            </template>
            
            <!-- Validation errors display -->
            <template if:true={hasValidationErrors}>
                <div class="hardis-note error slds-m-top_medium" role="alert">
                    <div>
                        <h2 class="slds-text-heading_small">{i18n.aliasValidationErrors}</h2>
                        <ul class="slds-list_dotted slds-m-top_small">
                            <template for:each={validationErrors} for:item="error">
                                <li key={error.username} class="slds-m-bottom_x-small">
                                    <strong>{error.username}</strong> (alias: "{error.alias}"): {error.error}
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </template>
        </div>
    </div>
    </div>
</template>
