<template>
  <div class="slds-scope slds-card blue-back hardis-workbench" data-theme={colorTheme} data-contrast={colorContrast}>
    <div class="hardis-page-head">
      <div class="hardis-tile featured violet">
        <lightning-icon icon-name="utility:database" alternative-text={i18n.dwbAltText} size="medium"></lightning-icon>
      </div>
      <div class="hardis-page-head-text">
        <h1 class="hardis-page-title">{i18n.dwbTitle}</h1>
        <p class="hardis-page-subtitle">{i18n.dwbDesc}</p>
      </div>
      <div class="hardis-page-head-actions">
        <lightning-button
          variant="neutral"
          label={i18n.dwbSfdmuDocLabel}
          title={i18n.dwbSfdmuDocTooltip}
          icon-name="utility:new_window"
          onclick={handleOpenSfdmuDoc}
        ></lightning-button>
        <lightning-button class="hardis-btn-tinted-blue"
          variant="neutral"
          label={i18n.dwbCreateWorkspace}
          title={i18n.dwbCreateWorkspaceTooltip}
          icon-name="utility:add"
          onclick={handleCreateWorkspace}
        ></lightning-button>
      </div>
    </div>

    <!-- Panel-level three-state body switch -->
    <template if:true={isLoadingState}>
      <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
        <lightning-spinner alternative-text={i18n.loadingLabel} size="medium"></lightning-spinner>
      </div>
    </template>
    <template if:true={hasError}>
      <div class="slds-text-align_center slds-p-around_large">
        <p>{i18n.featureLoadFailed}</p>
        <p class="slds-text-color_weak slds-text-body_small slds-m-top_small">{loadError}</p>
        <div class="slds-m-top_medium"><lightning-button label={i18n.tryAgainLabel} onclick={handleRetry}></lightning-button></div>
      </div>
    </template>
    <template if:true={isReady}>

    <template if:true={isLoading}>
      <div class="hardis-panel-body">
        <div class="slds-text-align_center slds-p-around_large">
          <lightning-spinner alternative-text={i18n.dwbLoadingWorkspaces} size="medium"></lightning-spinner>
          <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">{i18n.dwbLoadingWorkspaces}</p>
        </div>
      </div>
    </template>

    <template if:false={isLoading}>
      <template if:false={hasWorkspaces}>
        <div class="hardis-panel-body">
          <div class="hardis-empty">
            <div class="hardis-tile featured violet">
              <lightning-icon icon-name="utility:database" size="small"></lightning-icon>
            </div>
            <h3 class="hardis-empty-title">{i18n.dwbNoWorkspacesFound}</h3>
            <p class="hardis-empty-desc">{i18n.dwbNoWorkspacesFoundDesc}</p>
            <div class="hardis-empty-actions">
              <lightning-button
                variant="neutral"
                label={i18n.dwbCreateFirstWorkspace}
                class="hardis-btn-tinted-blue"
                onclick={handleCreateWorkspace}
              ></lightning-button>
            </div>
          </div>
        </div>
      </template>
    </template>

    <template if:false={isLoading}>
      <template if:true={hasWorkspaces}>
        <div class="hardis-split">
          <div class="hardis-panel-body hardis-split-rail">
            <div class="hardis-group-label">
              {i18n.dwbAvailableWorkspaces}
              <span class="hardis-count-chip">{workspacesCount}</span>
              <div class="hardis-group-actions">
                <s-multiline-helptext content={i18n.dwbAvailableWorkspacesHelp}></s-multiline-helptext>
              </div>
            </div>
            <div class="hardis-card-grid single-column">
              <template for:each={workspacesForDisplay} for:item="workspace">
                <div
                  key={workspace.path}
                  class={workspace.cardClass}
                  role="button"
                  tabindex="0"
                  aria-pressed={workspace.isSelected}
                  data-path={workspace.path}
                  onclick={handleWorkspaceSelect}
                  onkeydown={handleCardKeydown}
                >
                  <div class="hardis-card-head">
                    <div class="hardis-tile small violet">
                      <lightning-icon icon-name="utility:database" size="x-small"></lightning-icon>
                    </div>
                    <h3 class="hardis-card-title">{workspace.label}</h3>
                  </div>
                  <p class="hardis-card-desc">{workspace.meta}</p>
                </div>
              </template>
            </div>
          </div>

          <div class="hardis-panel-body hardis-split-main">
            <template if:true={selectedWorkspace}>
              <div class="hardis-page-head flush">
                <div class="hardis-page-head-text">
                  <h2 class="hardis-page-title">{selectedWorkspace.label}</h2>
                  <p class="hardis-page-subtitle">{selectedWorkspace.name}</p>
                </div>
                <div class="hardis-page-head-actions">
                  <template if:true={showLargeActions}>
                    <lightning-button class="hardis-btn-tinted-blue"
                      variant="neutral"
                      label={i18n.dwbExportData}
                      title={i18n.dwbExportDataTooltip}
                      icon-name="utility:download"
                      icon-position="left"
                      onclick={handleExportData}
                    ></lightning-button>
                    <lightning-button class="hardis-btn-tinted-blue"
                      variant="neutral"
                      label={i18n.dwbImportData}
                      title={i18n.dwbImportDataTooltip}
                      icon-name="utility:upload"
                      icon-position="left"
                      onclick={handleImportData}
                    ></lightning-button>
                    <lightning-button class="hardis-btn-tinted-red"
                      variant="neutral"
                      label={i18n.dwbDeleteData}
                      title={i18n.dwbDeleteDataTooltip}
                      icon-name="utility:close"
                      icon-position="left"
                      onclick={handleDeleteData}
                    ></lightning-button>
                  </template>
                  <template if:false={showLargeActions}>
                    <lightning-button-menu
                      alternative-text={i18n.dwbWorkspaceActions}
                      menu-alignment="right"
                      variant="border-filled"
                      icon-name="utility:down"
                    >
                      <lightning-menu-item
                        value="export"
                        label={i18n.dwbExportDataMenu}
                        icon-name="utility:download"
                        onclick={handleExportData}
                      ></lightning-menu-item>
                      <lightning-menu-item
                        value="import"
                        label={i18n.dwbImportDataMenu}
                        icon-name="utility:upload"
                        onclick={handleImportData}
                      ></lightning-menu-item>
                      <lightning-menu-item
                        value="deleteData"
                        label={i18n.dwbDeleteDataMenu}
                        icon-name="utility:close"
                        onclick={handleDeleteData}
                      ></lightning-menu-item>
                    </lightning-button-menu>
                  </template>
                </div>
              </div>

              <!-- Section: Workspace Properties -->
              <div class="hardis-group-label">
                {i18n.dwbProperties}
                <div class="hardis-group-actions">
                  <lightning-button
                    variant="neutral"
                    label={i18n.dwbEditProperties}
                    title={i18n.dwbEditPropertiesTooltip}
                    icon-name="utility:edit"
                    onclick={handleEditProperties}
                  ></lightning-button>
                  <lightning-button
                    variant="neutral"
                    label={i18n.dwbOpenFolder}
                    title={i18n.dwbOpenFolderTooltip}
                    icon-name="utility:open_folder"
                    onclick={handleOpenFolder}
                  ></lightning-button>
                  <lightning-button
                    variant="neutral"
                    label={i18n.dwbOpenExportJson}
                    title={i18n.dwbOpenExportJsonTooltip}
                    icon-name="utility:open"
                    onclick={handleConfigureWorkspace}
                  ></lightning-button>
                  <lightning-button
                    variant="neutral"
                    class="hardis-btn-tinted-red"
                    label={i18n.dwbDeleteWorkspace}
                    title={i18n.dwbDeleteWorkspaceTooltip}
                    icon-name="utility:delete"
                    data-path={selectedWorkspace.path}
                    onclick={handleDeleteWorkspace}
                  ></lightning-button>
                </div>
              </div>
              <template if:true={selectedWorkspaceHasDescription}>
                <div class="hardis-prop-grid">
                  <div class="hardis-prop">
                    <div class="hardis-prop-key">{i18n.dwbDescriptionLabel}</div>
                    <div class="hardis-prop-value">{selectedWorkspace.description}</div>
                  </div>
                </div>
              </template>

              <!-- Section: Global Settings -->
              <div class="hardis-group-label">
                {i18n.dwbGlobalSettings}
                <div class="hardis-group-actions">
                  <lightning-button
                    variant="neutral"
                    label={i18n.dwbEditGlobalSettings}
                    title={i18n.dwbEditGlobalSettingsTooltip}
                    icon-name="utility:settings"
                    onclick={handleEditGlobalSettings}
                  ></lightning-button>
                </div>
              </div>
              <template if:true={hasScriptSettings}>
                <div class="hardis-chip-row">
                  <template if:true={ssHasApiVersion}>
                    <span class="hardis-chip" title={i18n.dwbBadgeApiVersion}>API: {ssApiVersion}</span>
                  </template>
                  <template if:true={ssSimulationMode}>
                    <span class="hardis-chip" title={i18n.dwbBadgeSimulationMode}>{i18n.dwbBadgeSimulationModeLabel}</span>
                  </template>
                  <template if:true={ssAllOrNone}>
                    <span class="hardis-chip" title={i18n.dwbBadgeAllOrNone}>{i18n.dwbBadgeAllOrNoneLabel}</span>
                  </template>
                  <template if:true={ssAllowFieldTruncation}>
                    <span class="hardis-chip" title={i18n.dwbBadgeAllowTruncation}>{i18n.dwbBadgeAllowTruncationLabel}</span>
                  </template>
                  <template if:true={ssKeepObjectOrder}>
                    <span class="hardis-chip" title={i18n.dwbBadgeKeepOrder}>{i18n.dwbBadgeKeepOrderLabel}</span>
                  </template>
                  <template if:true={ssHasBulkApiVersion}>
                    <span class="hardis-chip" title={i18n.dwbBadgeBulkApiVersion}>Bulk API: {ssBulkApiVersion}</span>
                  </template>
                  <template if:true={ssHasConcurrencyMode}>
                    <span class="hardis-chip" title={i18n.dwbBadgeConcurrencyMode}>Concurrency: {ssConcurrencyMode}</span>
                  </template>
                  <template if:true={ssHasBulkThreshold}>
                    <span class="hardis-chip" title={i18n.dwbBadgeBulkThreshold}>Bulk Threshold: {ssBulkThreshold}</span>
                  </template>
                  <template if:true={ssHasQueryBulkApiThreshold}>
                    <span class="hardis-chip" title={i18n.dwbBadgeQueryBulkThreshold}>Query Bulk Threshold: {ssQueryBulkApiThreshold}</span>
                  </template>
                  <template if:true={ssHasBulkApiV1BatchSize}>
                    <span class="hardis-chip" title={i18n.dwbBadgeBulkBatchSize}>Bulk Batch: {ssBulkApiV1BatchSize}</span>
                  </template>
                  <template if:true={ssHasRestApiBatchSize}>
                    <span class="hardis-chip" title={i18n.dwbBadgeRestBatchSize}>REST Batch: {ssRestApiBatchSize}</span>
                  </template>
                  <template if:true={ssAlwaysUseRestApiToUpdateRecords}>
                    <span class="hardis-chip" title={i18n.dwbBadgeRestUpdates}>{i18n.dwbBadgeRestUpdatesLabel}</span>
                  </template>
                  <template if:true={ssHasParallelBulkJobs}>
                    <span class="hardis-chip" title={i18n.dwbBadgeParallelBulk}>Parallel Bulk: {ssParallelBulkJobs}</span>
                  </template>
                  <template if:true={ssHasParallelRestJobs}>
                    <span class="hardis-chip" title={i18n.dwbBadgeParallelRest}>Parallel REST: {ssParallelRestJobs}</span>
                  </template>
                  <template if:true={ssHasParallelBinaryDownloads}>
                    <span class="hardis-chip" title={i18n.dwbBadgeParallelBinary}>Parallel Binary: {ssParallelBinaryDownloads}</span>
                  </template>
                  <template if:true={ssCreateTargetCSVFiles}>
                    <span class="hardis-chip" title={i18n.dwbBadgeTargetCsv}>{i18n.dwbBadgeTargetCsvLabel}</span>
                  </template>
                  <template if:true={ssCsvInsertNulls}>
                    <span class="hardis-chip" title={i18n.dwbBadgeCsvNulls}>{i18n.dwbBadgeCsvNullsLabel}</span>
                  </template>
                  <template if:true={ssCsvUseEuropeanDateFormat}>
                    <span class="hardis-chip" title={i18n.dwbBadgeEuDates}>{i18n.dwbBadgeEuDatesLabel}</span>
                  </template>
                  <template if:true={ssHasCsvFileEncoding}>
                    <span class="hardis-chip" title={i18n.dwbBadgeCsvEncoding}>Encoding: {ssCsvFileEncoding}</span>
                  </template>
                  <template if:true={ssHasBinaryDataCache}>
                    <span class="hardis-chip" title={i18n.dwbBadgeBinaryCache}>Binary Cache: {ssBinaryDataCache}</span>
                  </template>
                  <template if:true={ssHasSourceRecordsCache}>
                    <span class="hardis-chip" title={i18n.dwbBadgeSourceCache}>Source Cache: {ssSourceRecordsCache}</span>
                  </template>
                  <template if:true={ssHasExcludedObjects}>
                    <span class="hardis-chip" title={i18n.dwbBadgeExcludedObjects}>Excluded: {ssExcludedObjects}</span>
                  </template>
                  <template if:true={ssHasProxyUrl}>
                    <span class="hardis-chip" title={i18n.dwbBadgeProxy}>{i18n.dwbBadgeProxyLabel}</span>
                  </template>
                </div>
              </template>
              <template if:false={hasScriptSettings}>
                <div class="hardis-note">
                  <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                  <p>{i18n.dwbNoGlobalSettings}</p>
                </div>
              </template>

              <!-- Section: Objects -->
              <div class="hardis-group-label">
                {i18n.objectsLabel}
                <span class="hardis-count-chip">{selectedWorkspaceObjectsCount}</span>
                <div class="hardis-group-actions">
                  <lightning-button
                    variant="neutral"
                    class="hardis-btn-tinted-blue"
                    label={i18n.dwbAddObject}
                    title={i18n.dwbAddObjectTooltip}
                    icon-name="utility:add"
                    onclick={handleAddObject}
                  ></lightning-button>
                </div>
              </div>
              <template if:true={hasSelectedWorkspaceObjects}>
                <div class="hardis-card-grid single-column">
                  <template for:each={selectedWorkspaceObjectsForDisplay} for:item="obj">
                    <div key={obj.displayIndex} class="hardis-card">
                      <div class="hardis-card-head">
                        <div class="hardis-tile small violet">
                          <lightning-icon icon-name="utility:sobject" size="x-small"></lightning-icon>
                        </div>
                        <div class="dwb-obj-title-row">
                          <h3 class="hardis-card-title">{obj.objectName}</h3>
                          <span class={obj.operationPillClass}><span class="hardis-pill-dot"></span>{obj.operation}</span>
                        </div>
                        <div class="dwb-obj-actions">
                          <lightning-button
                            variant="neutral"
                            label={i18n.dwbEditObject}
                            icon-name="utility:edit"
                            data-index={obj.index}
                            onclick={handleEditObject}
                          ></lightning-button>
                          <lightning-button
                            variant="neutral"
                            class="hardis-btn-tinted-red"
                            label={i18n.dwbDeleteObject}
                            icon-name="utility:delete"
                            data-index={obj.index}
                            onclick={handleDeleteObject}
                          ></lightning-button>
                        </div>
                      </div>
                      <div class="hardis-prop-value mono dwb-obj-query" title={obj.query}>{obj.query}</div>
                      <div class="hardis-chip-row">
                        <template if:true={obj.externalId}>
                          <span class="hardis-chip">{i18n.dwbObjBadgeExternalId}: {obj.externalId}</span>
                        </template>
                        <template if:true={obj.isExcluded}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeExcluded}>{i18n.dwbObjBadgeExcludedLabel}</span>
                        </template>
                        <template if:true={obj.deleteOldData}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeDeleteOldData}>{i18n.dwbObjBadgeDeleteOldDataLabel}</span>
                        </template>
                        <template if:true={obj.hasHardDelete}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeHardDelete}>{i18n.dwbObjBadgeHardDeleteLabel}</span>
                        </template>
                        <template if:true={obj.hasDeleteByHierarchy}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeDeleteHierarchy}>{i18n.dwbObjBadgeDeleteHierarchyLabel}</span>
                        </template>
                        <template if:true={obj.hasDeleteFromSource}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeDeleteSource}>{i18n.dwbObjBadgeDeleteSourceLabel}</span>
                        </template>
                        <template if:true={obj.useQueryAll}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeUseQueryAll}>{i18n.dwbObjBadgeUseQueryAllLabel}</span>
                        </template>
                        <template if:true={obj.hasQueryAllTarget}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeQueryAllTarget}>{i18n.dwbObjBadgeQueryAllTargetLabel}</span>
                        </template>
                        <template if:true={obj.allOrNone}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeAllOrNone}>{i18n.dwbObjBadgeAllOrNoneLabel}</span>
                        </template>
                        <template if:true={obj.hasSkipExistingRecords}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeSkipExisting}>{i18n.dwbObjBadgeSkipExistingLabel}</span>
                        </template>
                        <template if:true={obj.hasUseFieldMapping}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeFieldMapping}>{i18n.dwbObjBadgeFieldMappingLabel}</span>
                        </template>
                        <template if:true={obj.hasUseValuesMapping}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeValuesMapping}>{i18n.dwbObjBadgeValuesMappingLabel}</span>
                        </template>
                        <template if:true={obj.hasUseSourceCSVFile}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeCsvSource}>{i18n.dwbObjBadgeCsvSourceLabel}</span>
                        </template>
                        <template if:true={obj.hasMasterFilter}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeMasterFiltered}>{i18n.dwbObjBadgeMasterFilteredLabel}</span>
                        </template>
                        <template if:true={obj.updateWithMockData}>
                          <span class="hardis-chip" title={i18n.dwbObjBadgeMockData}>{i18n.dwbObjBadgeMockDataLabel}</span>
                        </template>
                        <template if:true={obj.hasMockFields}>
                          <span class="hardis-chip">{obj.mockFieldsCountLabel}</span>
                        </template>
                        <template if:true={obj.hasBulkApiV1BatchSize}>
                          <span class="hardis-chip">{i18n.dwbObjBadgeBulkBatch}: {obj.bulkApiV1BatchSize}</span>
                        </template>
                        <template if:true={obj.hasRestApiBatchSize}>
                          <span class="hardis-chip">{i18n.dwbObjBadgeRestBatch}: {obj.restApiBatchSize}</span>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <template if:false={hasSelectedWorkspaceObjects}>
                <div class="hardis-note">
                  <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                  <p>{i18n.dwbNoObjectsConfigured}</p>
                </div>
              </template>

              <!-- Section: Exported Files -->
              <div class="hardis-group-label">
                {i18n.dwbExportedFiles}
                <template if:true={hasExportedFiles}>
                  <span class="hardis-count-chip">{exportedFilesCount}</span>
                </template>
                <div class="hardis-group-actions">
                  <lightning-button
                    variant="neutral"
                    label={i18n.dwbRefreshExportedFiles}
                    title={i18n.dwbRefreshExportedFiles}
                    icon-name="utility:refresh"
                    onclick={handleRefreshExportedFiles}
                  ></lightning-button>
                </div>
              </div>
              <template if:true={hasExportedFiles}>
                <s-hardis-datatable
                  key-field="path"
                  data={exportedFilesForDisplay}
                  columns={exportedFilesColumns}
                  hide-checkbox-column
                  show-row-number-column
                  onrowaction={handleExportedFileAction}
                  class="exported-files-table"
                ></s-hardis-datatable>
              </template>
              <template if:false={hasExportedFiles}>
                <div class="hardis-note">
                  <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                  <p>{i18n.dwbNoExportedFiles}</p>
                </div>
              </template>

              <!-- Section: Logs -->
              <div class="hardis-group-label">
                {i18n.dwbLogs}
                <template if:true={hasLogFiles}>
                  <span class="hardis-count-chip">{logFilesCount}</span>
                </template>
                <div class="hardis-group-actions">
                  <lightning-button
                    variant="neutral"
                    label={i18n.dwbRefreshLogs}
                    title={i18n.dwbRefreshLogs}
                    icon-name="utility:refresh"
                    onclick={handleRefreshExportedFiles}
                  ></lightning-button>
                </div>
              </div>
              <template if:true={hasLogFiles}>
                <s-hardis-datatable
                  key-field="path"
                  data={logFilesForDisplay}
                  columns={logFilesColumns}
                  hide-checkbox-column
                  show-row-number-column
                  onrowaction={handleLogFileAction}
                  class="exported-files-table"
                ></s-hardis-datatable>
              </template>
              <template if:false={hasLogFiles}>
                <div class="hardis-note">
                  <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                  <p>{i18n.dwbNoLogFiles}</p>
                </div>
              </template>
            </template>

            <template if:false={selectedWorkspace}>
              <div class="hardis-empty">
                <div class="hardis-tile featured violet">
                  <lightning-icon icon-name="utility:touch_action" size="small"></lightning-icon>
                </div>
                <h3 class="hardis-empty-title">{i18n.dwbSelectWorkspace}</h3>
                <p class="hardis-empty-desc">{i18n.dwbSelectWorkspaceDesc}</p>
              </div>
            </template>
          </div>
        </div>
      </template>
    </template>
    </template><!-- end isReady -->
  </div>

  <!-- Properties Modal (Create / Edit Workspace Properties) -->
  <template if:true={showPropertiesModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <div class="modal-accent-strip"></div>
        <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.closeLabel} onclick={handleCancelProperties}>
            <lightning-icon icon-name="utility:close" alternative-text={i18n.closeLabel} size="small"></lightning-icon>
            <span class="slds-assistive-text">{i18n.closeLabel}</span>
          </button>
          <h2 class="slds-modal__title slds-hyphenate">{propertiesModalTitle}</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-properties">
          <!-- Template selector - only shown when creating a new workspace -->
          <template if:false={editingWorkspace}>
            <div class="slds-form-element slds-m-bottom_medium">
              <label class="slds-form-element__label" for="workspace-template">
                {i18n.workspaceTemplateLabel}
                <s-multiline-helptext content={i18n.workspaceTemplateHelp}></s-multiline-helptext>
              </label>
              <div class="slds-form-element__control slds-grid slds-grid_vertical-align-center">
                <lightning-combobox
                  variant="label-hidden"
                  name="workspace-template"
                  value={selectedTemplateUrl}
                  options={templateOptions}
                  disabled={isLoadingTemplates}
                  onchange={handleTemplateChange}
                  class="slds-grow"
                ></lightning-combobox>
                <template if:true={isLoadingTemplates}>
                  <lightning-spinner alternative-text={i18n.workspaceTemplateLoading} size="small" class="slds-m-left_small"></lightning-spinner>
                </template>
              </div>
            </div>
          </template>

          <div class="slds-form-element slds-m-bottom_medium">
            <label class="slds-form-element__label" for="workspace-name">
              <abbr class="slds-required" title="required">* </abbr>{i18n.dwbWorkspaceNameLabel}
              <s-multiline-helptext content={i18n.dwbWorkspaceNameHelp}></s-multiline-helptext>
            </label>
            <div class="slds-form-element__control">
              <lightning-input
                variant="label-hidden"
                type="text"
                name="workspace-name"
                placeholder={i18n.dwbWorkspaceNamePlaceholder}
                value={workspaceProperties.name}
                onchange={handlePropertiesNameChange}
                required
              ></lightning-input>
            </div>
          </div>
