<template>
  <div class="bfe-root">
    <!-- Plugin state: loading, missing or too old (installed from the Setup panel), catalog error -->
    <template if:true={showCatalogLoading}>
      <p class="loading-text bfe-block">{i18n.browserforceCatalogLoading}</p>
    </template>
    <template if:true={showNotInstalled}>
      <div class="hardis-note warning bfe-block bfe-note-with-action">
        <span>{notInstalledText}</span>
        <div class="bfe-note-actions">
          <lightning-button
            variant="neutral"
            class="hardis-btn-tinted-blue"
            label={i18n.openSetup}
            onclick={handleOpenSetup}
          ></lightning-button>
          <lightning-button
            variant="neutral"
            label={i18n.browserforceRetry}
            onclick={handleReloadCatalog}
          ></lightning-button>
        </div>
      </div>
    </template>
    <template if:true={showCatalogError}>
      <div class="hardis-note error bfe-block bfe-note-with-action" role="alert">
        <span>{catalogErrorText}</span>
        <lightning-button
          variant="neutral"
          label={i18n.browserforceRetry}
          onclick={handleReloadCatalog}
        ></lightning-button>
      </div>
    </template>

    <!-- Setting -->
    <div class="slds-form-element bfe-block">
      <label class="slds-form-element__label hardis-label-inline">
        <span>
          <abbr class="slds-required" title={i18n.requiredField}>*</abbr>
          {i18n.browserforceSettingLabel}
        </span>
        <s-multiline-helptext content={i18n.browserforceSettingHelp} class="slds-icon-text-info"></s-multiline-helptext>
      </label>
      <template if:true={showSettingPicker}>
        <s-typeahead
          label={i18n.browserforceSettingLabel}
          variant="label-hidden"
          value={setting}
          options={settingOptions}
          placeholder={i18n.browserforceSettingPlaceholder}
          disabled={inputsDisabled}
          onchange={handleSettingSelect}
        ></s-typeahead>
      </template>
      <template if:true={showSettingKeyInput}>
        <lightning-input
          label={i18n.browserforceSettingLabel}
          variant="label-hidden"
          value={setting}
          placeholder="densitySettings"
          field-level-help={i18n.browserforceSettingKeyHelp}
          disabled={inputsDisabled}
          onchange={handleSettingKeyChange}
        ></lightning-input>
      </template>
      <template if:true={readOnly}>
        <p class="hardis-field-value mono bfe-readonly-setting">{settingTitle}</p>
      </template>
      <template if:true={hasSettingDescription}>
        <p class="hardis-field-help bfe-help">{settingDescription}</p>
      </template>
    </div>

    <template if:true={hasDeprecatedText}>
      <div class="hardis-note warning bfe-block" role="alert">{deprecatedText}</div>
    </template>
    <template if:true={showUnknownSetting}>
      <div class="hardis-note warning bfe-block" role="alert">{unknownSettingText}</div>
    </template>
    <template if:true={hasWarnings}>
      <template for:each={warnings} for:item="warning">
        <div key={warning.key} class="hardis-note warning bfe-block">{warning.text}</div>
      </template>
    </template>

    <!-- Value: generated form, or JSON -->
    <template if:true={showJsonSwitch}>
      <div class="bfe-block">
        <lightning-input
          type="toggle"
          label={i18n.browserforceEditAsJson}
          checked={jsonMode}
          disabled={inputsDisabled}
          onchange={handleJsonModeToggle}
          message-toggle-active=""
          message-toggle-inactive=""
        ></lightning-input>
        <template if:true={jsonSwitchError}>
          <p class="slds-form-element__help slds-text-color_error bfe-error">{jsonSwitchError}</p>
        </template>
      </div>
    </template>

    <template if:true={showForm}>
      <template for:each={formSections} for:item="section">
        <div key={section.key} class="bfe-section">
          <template if:true={section.isGroup}>
            <div class="hardis-group-label">
              {section.title}
              <div class="hardis-group-actions">
                <lightning-button
                  variant="neutral"
                  icon-name="utility:add"
                  label={i18n.browserforceAddItem}
                  data-group-path={section.groupPath}
                  disabled={inputsDisabled}
                  onclick={handleAddItem}
                ></lightning-button>
              </div>
            </div>
            <template if:true={section.hasHelp}>
              <p class="hardis-group-desc">{section.help}</p>
            </template>
            <template if:true={section.isEmpty}>
              <p class="hardis-field-help bfe-help">{i18n.browserforceNoItem}</p>
            </template>
          </template>
          <template for:each={section.items} for:item="item">
            <div key={item.key} class={item.itemClass}>
              <template if:true={item.isGroupItem}>
                <div class="bfe-item-head">
                  <span class="hardis-card-title">{item.title}</span>
                  <lightning-button
                    variant="neutral"
                    class="hardis-btn-tinted-red"
                    icon-name="utility:delete"
                    label={i18n.browserforceRemoveItem}
                    data-group-path={item.groupPath}
                    data-index={item.index}
                    disabled={inputsDisabled}
                    onclick={handleRemoveItem}
                  ></lightning-button>
                </div>
              </template>
              <template if:true={item.isRecordEntry}>
                <div class="hardis-field-row">
                  <div class="hardis-field-text">
                    <div class="hardis-field-label">
                      <span><abbr class="slds-required" title={i18n.requiredField}>*</abbr>{i18n.browserforceEntryName}</span>
                    </div>
                    <div class="hardis-field-help">{section.keyPatternText}</div>
                  </div>
                  <div class="hardis-field-control">
                    <lightning-input
                      label={i18n.browserforceEntryName}
                      variant="label-hidden"
                      value={item.name}
                      data-group-path={item.groupPath}
                      data-index={item.index}
                      disabled={inputsDisabled}
                      onchange={handleEntryNameChange}
                    ></lightning-input>
                    <template if:true={item.hasNameError}>
                      <p class="slds-form-element__help slds-text-color_error bfe-error">{item.nameErrorText}</p>
                    </template>
                  </div>
                </div>
              </template>
              <template for:each={item.fields} for:item="field">
                <div key={field.key} class={field.rowClass}>
                  <div class="hardis-field-text">
                    <div class="hardis-field-label">
                      <span>
                        <template if:true={field.required}>
                          <abbr class="slds-required" title={i18n.requiredField}>*</abbr>
                        </template>
                        {field.label}
                      </span>
                    </div>
                    <template if:true={field.hasHelp}>
                      <div class="hardis-field-help">{field.help}</div>
                    </template>
                  </div>
                  <div class="hardis-field-control">
                    <template if:true={field.showVariableInput}>
                      <lightning-input
                        label={i18n.browserforceVariableNameLabel}
                        value={field.variableName}
                        placeholder={i18n.browserforceVariableNamePlaceholder}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleVariableNameChange}
                      ></lightning-input>
                    </template>
                    <template if:true={field.isString}>
                      <lightning-input
                        label={field.label}
                        variant="label-hidden"
                        value={field.text}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleTextChange}
                      ></lightning-input>
                    </template>
                    <template if:true={field.isEnum}>
                      <lightning-combobox
                        label={field.label}
                        variant="label-hidden"
                        value={field.text}
                        options={field.options}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleTextChange}
                      ></lightning-combobox>
                    </template>
                    <template if:true={field.isBoolean}>
                      <lightning-input
                        type="checkbox"
                        label={field.label}
                        variant="label-hidden"
                        checked={field.checked}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleCheckboxChange}
                      ></lightning-input>
                    </template>
                    <template if:true={field.isNumber}>
                      <lightning-input
                        type="number"
                        step={field.step}
                        label={field.label}
                        variant="label-hidden"
                        value={field.text}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleTextChange}
                      ></lightning-input>
                    </template>
                    <template if:true={field.isStringList}>
                      <lightning-textarea
                        label={field.label}
                        variant="label-hidden"
                        value={field.text}
                        placeholder={i18n.browserforceOneValuePerLine}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleTextChange}
                      ></lightning-textarea>
                    </template>
                    <template if:true={field.isJson}>
                      <lightning-textarea
                        class="bfe-json"
                        label={field.label}
                        variant="label-hidden"
                        value={field.text}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleTextChange}
                      ></lightning-textarea>
                    </template>
                    <template if:true={field.hasError}>
                      <p class="slds-form-element__help slds-text-color_error bfe-error">{field.errorText}</p>
                    </template>
                    <template if:true={field.hasLiteralSecret}>
                      <p class="hardis-note warning bfe-error">{i18n.browserforceSecretInClear}</p>
                    </template>
                    <template if:true={field.canToggleVariable}>
                      <lightning-input
                        type="checkbox"
                        label={i18n.browserforceValuePerOrg}
                        checked={field.isVariable}
                        data-key={field.key}
                        disabled={inputsDisabled}
                        onchange={handleVariableToggle}
                      ></lightning-input>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </template>

    <template if:true={showJsonEditor}>
      <div class="slds-form-element bfe-block">
        <label class="slds-form-element__label hardis-label-inline">
          <span>{i18n.browserforceValueLabel}</span>
          <s-multiline-helptext content={i18n.browserforceJsonHelp} class="slds-icon-text-info"></s-multiline-helptext>
        </label>
        <lightning-textarea
          class="bfe-json"
          label={i18n.browserforceValueLabel}
          variant="label-hidden"
          value={jsonText}
          disabled={inputsDisabled}
          onchange={handleJsonChange}
        ></lightning-textarea>
        <template if:true={jsonError}>
          <p class="slds-form-element__help slds-text-color_error bfe-error">{jsonError}</p>
        </template>
      </div>
    </template>

    <template if:true={showReadOnlyValue}>
      <div class="slds-form-element bfe-block">
        <span class="slds-form-element__label">{i18n.browserforceValueLabel}</span>
        <pre class="hardis-prop-value mono bfe-readonly-json">{configPretty}</pre>
      </div>
    </template>

    <!-- CI/CD variables the value references -->
    <template if:true={hasVariables}>
      <div class="bfe-block">
        <div class="hardis-group-label">{i18n.browserforceVariablesTitle}</div>
        <p class="hardis-group-desc">{variablesHelp}</p>
        <template if:true={hasSecretsLookupLabel}>
          <p class="hardis-field-help bfe-help">{secretsLookupLabel}</p>
        </template>
        <template for:each={variables} for:item="variable">
          <div key={variable.name} class="bfe-variable">
            <span class="hardis-chip">{variable.name}</span>
            <template if:true={variable.hasRows}>
              <div class="hardis-prop-grid bfe-variable-grid">
                <template for:each={variable.rows} for:item="row">
                  <div key={row.key} class="hardis-prop">
                    <div class="hardis-prop-key">{row.branch}</div>
                    <div class="hardis-prop-value mono">{row.names}</div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
        <template if:true={showGithubNote}>
          <div class="hardis-note bfe-block">{i18n.browserforceGithubEnvNote}</div>
        </template>
      </div>
    </template>

    <!-- Check with Browserforce -->
    <template if:true={showCheckButton}>
      <div class="bfe-block">
        <lightning-button
          variant="neutral"
          icon-name="utility:check"
          label={i18n.browserforceCheck}
          disabled={isCheckDisabled}
          onclick={handleCheck}
        ></lightning-button>
      </div>
    </template>
    <template if:true={showValidating}>
      <p class="loading-text bfe-block">{i18n.browserforceChecking}</p>
    </template>
    <template if:true={showValidationValid}>
      <div class="hardis-note success bfe-block">{i18n.browserforceCheckValid}</div>
    </template>
    <template if:true={showValidationErrors}>
      <div class="hardis-note error bfe-block" role="alert">
        <span>{i18n.browserforceCheckErrors}</span>
        <ul class="bfe-error-list">
          <template for:each={validationErrorRows} for:item="row">
            <li key={row.key}>{row.text}</li>
          </template>
        </ul>
      </div>
    </template>
    <template if:true={showValidationUnavailable}>
      <div class="hardis-note warning bfe-block">{validationUnavailableText}</div>
    </template>
  </div>
</template>
