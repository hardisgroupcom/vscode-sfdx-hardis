<template>
    <template if:true={loading}>
        <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
            <lightning-spinner alternative-text={i18n.loadingLabel} size="small"></lightning-spinner>
        </div>
    </template>
    <template if:true={showEmpty}>
        <div class="slds-align_absolute-center slds-p-around_medium">
            <p class="slds-text-color_weak">{emptyLabel}</p>
        </div>
    </template>
    <template if:true={hasRuns}>
        <div class="runs">
            <template for:each={rows} for:item="row">
                <div key={row.key} class="hardis-list">
                    <div class="hardis-list-row">
                        <div class="hardis-list-main">
                            <div class="hardis-list-title">{row.label}</div>
                            <template if:true={row.context}>
                                <div class="hardis-list-meta">{row.context}</div>
                            </template>
                        </div>
                        <div class="hardis-list-status">
                            <span class={row.pillClass}><span class="hardis-pill-dot"></span>{row.statusLabel}</span>
                        </div>
                        <div class="hardis-list-actions">
                            <template if:true={row.jobUrl}>
                                <button class="slds-button slds-button_neutral" data-url={row.jobUrl} onclick={handleOpenUrl}>{i18n.workflowOpenJob}</button>
                            </template>
                            <template if:true={row.commentUrl}>
                                <button class="slds-button slds-button_neutral" data-url={row.commentUrl} onclick={handleOpenUrl}>{i18n.workflowOpenComment}</button>
                            </template>
                        </div>
                    </div>
                    <template if:true={row.hasBody}>
                        <div class="hardis-list-detail">
                            <s-markdown-view markdown={row.body}></s-markdown-view>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>
</template>
