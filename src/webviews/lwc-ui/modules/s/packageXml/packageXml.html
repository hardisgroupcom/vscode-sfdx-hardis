<template>
    <div class="slds-scope" data-theme={colorTheme} data-contrast={colorContrast}>
        <!-- Header Section -->
        <div class="hardis-page-head">
            <div class="hardis-tile featured cyan">
                <lightning-icon icon-name={packageIconName} size="medium"></lightning-icon>
            </div>
            <div class="hardis-page-head-text">
                <h1 class="hardis-page-title">{packageTitle}</h1>
                <p class="hardis-page-subtitle">{packageDescription}</p>
            </div>
            <div class="hardis-page-head-actions">
                <lightning-input
                    type="toggle"
                    label={i18n.editModeLabel}
                    checked={editMode}
                    onchange={toggleEditMode}
                    class="edit-toggle"
                    message-toggle-active=""
                    message-toggle-inactive=""
                ></lightning-input>
                <lightning-button
                    variant="neutral"
                    label={i18n.refreshLabel}
                    title={refreshTooltip}
                    onclick={refreshPackageConfig}
                    icon-name="utility:refresh"
                ></lightning-button>
                <lightning-button
                    variant="neutral"
                    label={i18n.editFileLabel}
                    title={editTooltip}
                    onclick={editPackageFile}
                    icon-name="utility:edit"
                    class="hardis-btn-tinted-blue"
                ></lightning-button>
            </div>
        </div>

        <template if:true={isLoading}>
            <!-- Loading State -->
            <div class="hardis-panel-body pkgxml-loading">
                <lightning-spinner alternative-text={i18n.loadingPackageConfig} size="medium"></lightning-spinner>
                <p class="pkgxml-loading-text">{i18n.loadingPackageConfig}</p>
            </div>
        </template>

        <template if:true={isMutating}>
            <div class="pkgxml-mutating-overlay">
                <lightning-spinner alternative-text={i18n.updatingPackage} size="small"></lightning-spinner>
            </div>
        </template>

        <!-- Add Type Modal -->
        <template if:true={showAddTypeModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="pkgxml-add-type-modal-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="modal-accent-strip"></div>
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.closeLabel} onclick={closeModals}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text={i18n.closeLabel}></lightning-icon>
                            <span class="slds-assistive-text">{i18n.closeLabel}</span>
                        </button>
                        <h2 id="pkgxml-add-type-modal-heading" class="slds-modal__title slds-hyphenate">{i18n.addMetadataType}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            type="text"
                            label={i18n.metadataTypeApiName}
                            value={newEntryName}
                            data-modal-input="new-entry"
                            onchange={handleModalInputChange}
                            onkeydown={handleModalKeydown}
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label={i18n.cancelLabel} onclick={closeModals}></lightning-button>
                        <lightning-button variant="neutral" label={i18n.addLabel} onclick={confirmAddType} class="hardis-btn-tinted-blue"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={closeModals}></div>
        </template>

        <!-- Add Member Modal -->
        <template if:true={showAddMemberModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="pkgxml-add-member-modal-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="modal-accent-strip"></div>
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.closeLabel} onclick={closeModals}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text={i18n.closeLabel}></lightning-icon>
                            <span class="slds-assistive-text">{i18n.closeLabel}</span>
                        </button>
                        <h2 id="pkgxml-add-member-modal-heading" class="slds-modal__title slds-hyphenate">{addMemberToTypeLabel}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            type="text"
                            label={i18n.memberNameLabel}
                            value={newEntryName}
                            data-modal-input="new-entry"
                            onchange={handleModalInputChange}
                            onkeydown={handleModalKeydown}
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label={i18n.cancelLabel} onclick={closeModals}></lightning-button>
                        <lightning-button variant="neutral" label={i18n.addLabel} onclick={confirmAddMember} class="hardis-btn-tinted-blue"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={closeModals}></div>
        </template>

        <template if:true={hasError}>
            <!-- Error State -->
            <div class="hardis-panel-body">
                <div class="hardis-empty">
                    <div class="hardis-tile featured red">
                        <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                    </div>
                    <h3 class="hardis-empty-title">{i18n.unableToLoadPackageConfig}</h3>
                    <p class="hardis-empty-desc">{errorMessage}</p>
                    <div class="hardis-empty-actions">
                        <lightning-button
                            variant="neutral"
                            label={i18n.tryAgainLabel}
                            onclick={refreshPackageConfig}
                            class="hardis-btn-tinted-blue"
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={hasPackageData}>
            <!-- Package summary -->
            <div class="hardis-panel-body">
                <div class="hardis-prop-grid">
                    <div class="hardis-prop">
                        <div class="hardis-prop-key">{i18n.apiVersionLabel}</div>
                        <div class="hardis-prop-value">{packageData.apiVersion}</div>
                    </div>
                    <div class="hardis-prop">
                        <div class="hardis-prop-key">{i18n.totalTypesLabel}</div>
                        <div class="hardis-prop-value">{totalTypes}</div>
                    </div>
                    <div class="hardis-prop">
                        <div class="hardis-prop-key">{i18n.totalMembersLabel}</div>
                        <div class="hardis-prop-value">{totalMembers}</div>
                    </div>
                    <div class="hardis-prop">
                        <div class="hardis-prop-key">{i18n.fileLocationLabel}</div>
                        <div class="hardis-prop-value mono">{packageFilePath}</div>
                    </div>
                    <template if:true={packageData.namespace}>
                        <div class="hardis-prop">
                            <div class="hardis-prop-key">{i18n.namespaceLabel}</div>
                            <div class="hardis-prop-value">{packageData.namespace}</div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Metadata Types Section -->
            <div class="hardis-panel-body">
                <div class="hardis-group-label">
                    {metadataTypesTitle}
                    <div class="hardis-group-actions">
                        <lightning-button
                            variant="neutral"
                            label={expandCollapseLabel}
                            title={expandCollapseLabel}
                            onclick={toggleExpandAll}
                            icon-name={expandCollapseIcon}
                        ></lightning-button>
                        <template if:true={editMode}>
                            <lightning-button
                                variant="neutral"
                                label={i18n.addTypeLabel}
                                title={i18n.addNewMetadataType}
                                onclick={addMetadataType}
                                icon-name="utility:add"
                                class="hardis-btn-tinted-blue"
                            ></lightning-button>
                        </template>
                    </div>
                </div>
                <p class="hardis-group-desc">{metadataTypesDescription}</p>

                <div class="pkgxml-toolbar">
                    <lightning-input
                        type="search"
                        placeholder={i18n.filterByTypeOrMember}
                        value={filterText}
                        onchange={handleFilterChange}
                        class="pkgxml-filter"
                    ></lightning-input>
                </div>

                <template if:true={hasFilteredTypes}>
                    <div class="pkgxml-types">
                        <template for:each={filteredTypes} for:item="metadataType">
                            <div key={metadataType.name} class="hardis-card">
                                <div
                                    class="pkgxml-type-head"
                                    onclick={toggleTypeExpansion}
                                    onkeydown={handleTypeHeaderKeydown}
                                    data-type-name={metadataType.name}
                                    role="button"
                                    tabindex="0"
                                >
                                    <div class="hardis-tile small cyan">
                                        <lightning-icon icon-name={metadataType.iconName} size="small"></lightning-icon>
                                    </div>
                                    <div class="pkgxml-type-info">
                                        <span class="hardis-card-title">{metadataType.name}</span>
                                        <span class="hardis-count-chip">{metadataType.memberCountLabel}</span>
                                        <lightning-icon
                                            icon-name="utility:info"
                                            size="x-small"
                                            alternative-text={i18n.viewDocumentation}
                                            title={metadataType.urlTooltip}
                                            onclick={openMetadataDocumentation}
                                            data-type-name={metadataType.name}
                                            class="pkgxml-type-doc-icon"
                                        ></lightning-icon>
                                    </div>
                                    <template if:true={editMode}>
                                        <div class="pkgxml-type-actions">
                                            <lightning-button
                                                variant="neutral"
                                                label={i18n.addMemberLabel}
                                                title={i18n.addMetadataElement}
                                                onclick={addMetadataMember}
                                                data-type-name={metadataType.name}
                                                icon-name="utility:add"
                                            ></lightning-button>
                                            <lightning-button
                                                variant="neutral"
                                                label={i18n.deleteLabel}
                                                title={i18n.removeMetadataTypeLabel}
                                                onclick={removeMetadataType}
                                                data-type-name={metadataType.name}
                                                class="hardis-btn-tinted-red"
                                            ></lightning-button>
                                        </div>
                                    </template>
                                    <lightning-icon
                                        icon-name={metadataType.expandIcon}
                                        size="x-small"
                                        class="pkgxml-toggle-icon"
                                    ></lightning-icon>
                                </div>

                                <template if:true={metadataType.isExpanded}>
                                    <div class="pkgxml-type-body">
                                        <template if:true={metadataType.hasWildcard}>
                                            <div class="hardis-note">
                                                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                                <span>{wildcardMessage}</span>
                                            </div>
                                        </template>

                                        <template if:false={metadataType.hasWildcard}>
                                            <div class="pkgxml-members">
                                                <template for:each={metadataType.members} for:item="member">
                                                    <div
                                                        key={member.name}
                                                        class="hardis-card clickable pkgxml-member"
                                                        onclick={openMember}
                                                        onkeydown={handleMemberKeydown}
                                                        data-type-name={metadataType.name}
                                                        data-member-name={member.name}
                                                        role="button"
                                                        tabindex="0"
                                                    >
                                                        <lightning-icon icon-name={metadataType.memberIconName} size="x-small"></lightning-icon>
                                                        <span class="hardis-prop-value mono pkgxml-member-name">{member.name}</span>

                                                        <div class="pkgxml-member-actions">
                                                            <template if:true={member.showDocLink}>
                                                                <lightning-icon
                                                                    icon-name="utility:info"
                                                                    size="x-small"
                                                                    alternative-text={i18n.viewDocumentation}
                                                                    title={member.docTooltip}
                                                                    onclick={openStandardObjectDocumentation}
                                                                    data-member-name={member.name}
                                                                    class="pkgxml-member-doc-icon"
                                                                ></lightning-icon>
                                                            </template>
                                                            <template if:true={editMode}>
                                                                <lightning-button-icon
                                                                    icon-name="utility:delete"
                                                                    variant="bare-destructive"
                                                                    size="small"
                                                                    alternative-text={i18n.removeMetadataMember}
                                                                    title={i18n.removeMetadataMember}
                                                                    onclick={removeMetadataMember}
                                                                    data-type-name={metadataType.name}
                                                                    data-member-name={member.name}
                                                                ></lightning-button-icon>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasFilteredTypes}>
                    <div class="hardis-empty">
                        <template if:true={filterText}>
                            <div class="hardis-tile featured cyan">
                                <lightning-icon icon-name="utility:search" size="medium"></lightning-icon>
                            </div>
                            <h3 class="hardis-empty-title">{i18n.noMatchingResults}</h3>
                            <p class="hardis-empty-desc">{noMatchingResultsDescLabel}</p>
                        </template>
                        <template if:false={filterText}>
                            <div class="hardis-tile featured cyan">
                                <lightning-icon icon-name={packageIconName} size="medium"></lightning-icon>
                            </div>
                            <h3 class="hardis-empty-title">{emptyStateTitle}</h3>
                            <p class="hardis-empty-desc">{emptyStateDescription}</p>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
