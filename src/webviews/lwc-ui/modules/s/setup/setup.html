<template>
    <div class="slds-scope blue-back">
        <div class="setup-container">
            <div class="hardis-page-head">
                <div class="hardis-tile featured teal">
                    <lightning-icon icon-name="utility:setup" size="medium"></lightning-icon>
                </div>
                <div class="hardis-page-head-text">
                    <h1 class="hardis-page-title">{i18n.sfdxHardisSetup}</h1>
                    <p class="hardis-page-subtitle">{i18n.checkAndInstallDependencies}</p>
                </div>
                <div class="hardis-page-head-actions">
                    <lightning-input
                        type="toggle"
                        label={i18n.autoUpdateDependencies}
                        name="autoUpdateDependencies"
                        checked={_autoUpdateDependencies}
                        onchange={handleAutoUpdateChange}
                        class="setup-toggle"
                        message-toggle-active=""
                        message-toggle-inactive=""
                    ></lightning-input>
                </div>
            </div>

            <div class="section">
                <!-- Overall state of the dependencies -->
                <div class="setup-summary">
                    <div class={summaryCardClass}>
                        <div class={summaryTileClass}>
                            <template if:true={summaryChecking}>
                                <div class="slds-is-relative spinner-wrapper" style="height: 2rem;">
                                    <s-spinner
                                        alternative-text="Loading..."
                                        size="small">
                                    </s-spinner>
                                </div>
                            </template>
                            <template if:false={summaryChecking}>
                                <lightning-icon icon-name={summaryIconName} size="small"></lightning-icon>
                            </template>
                        </div>
                        <div class="hardis-status-content">
                            <h3 class="hardis-status-title">{i18n.dependenciesStatusSummary}</h3>
                            <p class="hardis-status-desc">{summaryMessage}</p>
                        </div>
                        <div class="hardis-status-actions">
                            <template if:true={hasPendingActions}>
                                <template if:false={summaryChecking}>
                                    <lightning-button
                                        variant="neutral"
                                        class="hardis-btn-tinted-blue"
                                        label={runButtonLabel}
                                        onclick={runPendingInstalls}
                                        disabled={runButtonDisabled}
                                    ></lightning-button>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>

                <template if:true={isLoadingChecks}>
                    <div class="hardis-empty">
                        <div class="slds-is-relative setup-loading-spinner">
                            <s-spinner
                                alternative-text={i18n.checkInProgress}
                                size="medium">
                            </s-spinner>
                        </div>
                        <p class="hardis-empty-desc">{i18n.checkInProgress}</p>
                    </div>
                </template>

                <div class="hardis-status-grid">
                    <template for:each={checks} for:item="chk">
                        <div key={chk.id} class={chk.cardClass}>

                            <div class={chk.tileClass}>
                                <template if:true={chk.isBusy}>
                                    <div class="slds-is-relative spinner-wrapper" style="height: 2rem;">
                                        <s-spinner
                                            alternative-text="Loading..."
                                            size="small">
                                        </s-spinner>
                                    </div>
                                </template>
                                <template if:false={chk.isBusy}>
                                    <lightning-icon icon-name={chk.statusIcon} size="small"></lightning-icon>
                                </template>
                            </div>

                            <div class="hardis-status-content">
                                <h3 class="hardis-status-title">
                                    <span>{chk.label}</span>
                                    <span class="hardis-status-meta">{chk.version}</span>
                                </h3>
                                <p class="hardis-status-desc">{chk.explanation}</p>
                                <template if:true={chk.note}>
                                    <p class="hardis-status-desc">{chk.note}</p>
                                </template>
                            </div>

                            <div class="hardis-status-actions">
                                <!-- Single unified button driven by controller-computed attributes -->
                                 <template if:false={chk.missingPrerequisitesText}>
                                    <lightning-button
                                        class={chk.buttonClass}
                                        variant="neutral"
                                        label={chk.buttonLabel}
                                        data-id={chk.id}
                                        data-action={chk.buttonAction}
                                        onclick={handleUnifiedAction}
                                        disabled={chk.buttonDisabled}
                                    ></lightning-button>
                                    <template if:true={chk.showUninstallButton}>
                                        <lightning-button
                                            class="hardis-btn-tinted-red"
                                            variant="neutral"
                                            label={chk.uninstallLabel}
                                            data-id={chk.id}
                                            onclick={handleUninstall}
                                        ></lightning-button>
                                    </template>
                                </template>
                                <!-- show prereq hint only after we know the check completed and prerequisites are actually missing -->
                                <template if:true={chk.missingPrerequisitesText}>
                                    <p class="hardis-status-desc slds-text-color_error">{i18n.requiresLabel}<br/>{chk.missingPrerequisitesText}</p>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
