<template>
  <div class="slds-scope command-execution" data-theme={colorTheme} data-contrast={colorContrast}>
    <!-- Header: identity tile + command name + status pill + meta chips + toolbar -->
    <div class="hardis-cmd-head">
      <div class={commandTileClass}>
        <lightning-icon icon-name={commandTileIcon} size="x-small"></lightning-icon>
      </div>
      <div class="hardis-cmd-head-main">
        <div class="hardis-cmd-title-row">
          <span class="hardis-cmd-title" title={commandName}>{commandName}</span>
          <span class={statusPillClass}>
            <span class="hardis-pill-dot"></span>{statusPillLabel}
          </span>
        </div>
        <div class="hardis-cmd-meta">
          <template if:true={commandDuration}>
            <span class="hardis-chip" title={commandDurationLabel}>
              <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
              {commandDuration}
            </span>
          </template>
          <template if:true={targetOrgUsername}>
            <span class="hardis-chip" title={i18n.targetOrgTooltip}>
              <lightning-icon icon-name="utility:salesforce1" size="xx-small"></lightning-icon>
              {targetOrgUsername}
            </span>
          </template>
          <template if:true={commandLogFile}>
            <button class="hardis-chip hardis-chip-link" onclick={handleOpenCommandLogFile} title={i18n.openCommandLogFile}>
              <lightning-icon icon-name="utility:description" size="xx-small"></lightning-icon>
              {i18n.logFileLabel}
            </button>
          </template>
        </div>
      </div>
      <div class="hardis-cmd-actions">
        <!-- Run the same command again, once it is over (whatever its status) -->
        <template if:true={canRunAgain}>
          <lightning-button
            class="hardis-btn-tinted-blue"
            label={i18n.runAgain}
            icon-name="utility:refresh"
            title={i18n.runAgainTooltip}
            onclick={handleRunAgain}
          ></lightning-button>
        </template>
        <!-- Auto-close toggle -->
        <lightning-input
          type="toggle"
          label={i18n.autoCloseLabel}
          checked={isInAutocloseList}
          onchange={handleToggleAutoclose}
          title={i18n.autoCloseTooltip}
          message-toggle-active=""
          message-toggle-inactive=""
        ></lightning-input>
        <!-- Toggle for Simple/Advanced -->
        <lightning-input
          type="toggle"
          label={i18n.advancedDetails}
          checked={isAdvancedMode}
          onchange={handleToggleDetailsMode}
          title={i18n.advancedDetailsTooltip}
          message-toggle-active=""
          message-toggle-inactive=""
        ></lightning-input>
        <!-- Documentation button -->
        <template if:true={hasDocumentation}>
          <lightning-button-icon
            icon-name="utility:info"
            variant="border-filled"
            alternative-text={i18n.documentation}
            title={i18n.openCommandDocumentation}
            onclick={handleOpenDocumentation}
          ></lightning-button-icon>
        </template>
      </div>
    </div>

    <!-- Scrollable timeline -->
    <div class="log-container" tabindex="0" role="log" aria-live="polite" aria-label="Command execution logs" onclick={handleLogContainerClick}>
      <template if:true={logSectionsForDisplay.length}>
        <div class="hardis-tl">
          <template for:each={logSectionsForDisplay} for:item="section">
            <template if:false={section.isLatestQuestionSectionToHide}>
              <div key={section.id} class={section.itemClass}>
                <!-- Status node -->
                <div class={section.nodeClass}>
                  <template if:true={section.nodeIconName}>
                    <lightning-icon icon-name={section.nodeIconName} size="xx-small"></lightning-icon>
                  </template>
                </div>

                <!-- Progress section -->
                <template if:true={section.isProgress}>
                  <div class={section.rowClass} data-section-id={section.id} onclick={handleToggleSection} onkeydown={handleSectionKeydown} role="button" tabindex={section.rowTabIndex}>
                    <span class="hardis-tl-title">{section.title}</span>
                    <span class="hardis-tl-fill"></span>
                    <template if:true={section.showTime}>
                      <span class="hardis-tl-time">{section.timeLabel}</span>
                    </template>
                    <template if:true={section.hasLogs}>
                      <lightning-icon class="hardis-tl-chev" icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                    </template>
                  </div>
                  <div class="hardis-tl-progress">
                    <div class="hardis-progress-track">
                      <div class={section.progressFillClass} style={section.progressFillStyle}></div>
                    </div>
                    <div class="hardis-progress-meta">
                      <span>{section.progressStepText}</span>
                      <template if:true={section.progressTimeEstimation}>
                        <span>{section.progressTimeEstimation}</span>
                      </template>
                    </div>
                  </div>
                  <template if:true={section.isExpanded}>
                    <template if:true={section.hasLogs}>
                      <div class="hardis-tl-logs">
                        <template for:each={section.progressLogs} for:item="logLine">
                          <div key={logLine.id} class={logLine.cssClass}>
                            <template if:true={logLine.formattedMessage}>
                              <lightning-formatted-rich-text value={logLine.formattedMessage} disable-linkify="true"></lightning-formatted-rich-text>
                            </template>
                            <template if:false={logLine.formattedMessage}>
                              <span class="log-message">{logLine.message}</span>
                            </template>
                            <template if:true={logLine.hasBigContent}>
                              <div class={logLine.bigContentClass} data-log-id={logLine.id} role="button" tabindex="0" title={i18n.viewFullContentTooltip} onclick={handleShowFullContent} onkeydown={handleContentPreviewKeydown}>
                                <template if:true={logLine.bigContentPreview}>
                                  <pre class="hardis-content-preview-text">{logLine.bigContentPreview}</pre>
                                </template>
                                <span class="hardis-content-preview-more">{logLine.bigContentLabel}</span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </template>
                </template>

                <!-- Diff Files section (org vs local side-by-side diffs) -->
                <template if:true={section.isDiff}>
                  <div class={section.rowClass} data-section-id={section.id} onclick={handleToggleSection} onkeydown={handleSectionKeydown} role="button" tabindex={section.rowTabIndex} title={i18n.diffFilesSectionTooltip}>
                    <span class="hardis-tl-title">{i18n.diffFilesSectionTitle}</span>
                    <span class="hardis-tl-fill"></span>
                    <span class="hardis-tl-time">{section.diffFilesCount}</span>
                    <lightning-icon class="hardis-tl-chev" icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                  </div>
                  <template if:true={section.isExpanded}>
                    <div class="hardis-tl-logs diff-files-body">
                      <template for:each={section.diffFilesByType} for:item="group">
                        <div key={group.type} class="diff-files-group slds-m-bottom_small">
                          <div class="diff-files-group-title slds-text-title_caps slds-m-bottom_xx-small">
                            {group.type} ({group.count})
                          </div>
                          <ul class="diff-files-list">
                            <template for:each={group.files} for:item="file">
                              <li key={file.id} class="diff-file-row">
                                <a href="javascript:void(0);"
                                   class="diff-file-link"
                                   data-diff-id={file.id}
                                   onclick={handleOpenDiffFile}
                                   title={file.title}>
                                  <lightning-icon icon-name={file.statusIcon}
                                                  variant={file.statusVariant}
                                                  size="xx-small"
                                                  alternative-text={file.statusLabel}>
                                  </lightning-icon>
                                  <span class="diff-file-status-label slds-m-left_xx-small">{file.statusLabel}</span>
                                  <span class="diff-file-name slds-m-left_x-small">{file.metadataName}</span>
                                </a>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </div>
                  </template>
                </template>

                <!-- Regular section -->
                <template if:true={section.isRegular}>
                  <div class={section.rowClass} data-section-id={section.id} onclick={handleToggleSection} onkeydown={handleSectionKeydown} role="button" tabindex={section.rowTabIndex}>
                    <span class={section.titleClass}>
                      <template if:true={section.actionLog.formattedMessage}>
                        <lightning-formatted-rich-text value={section.actionLog.formattedMessage} disable-linkify="true"></lightning-formatted-rich-text>
                      </template>
                      <template if:false={section.actionLog.formattedMessage}>
                        {section.actionLog.message}
                      </template>
                    </span>
                    <template if:true={section.answerChipText}>
                      <span class="hardis-tl-answer" title={section.answerChipTitle}>{section.answerChipText}</span>
                    </template>
                    <span class="hardis-tl-fill"></span>
                    <template if:true={section.showTime}>
                      <span class="hardis-tl-time">{section.timeLabel}</span>
                    </template>
                    <template if:true={section.hasLogs}>
                      <lightning-icon class="hardis-tl-chev" icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                    </template>
                  </div>

                  <template if:true={section.isExpanded}>
                    <template if:true={section.hasLogs}>
                      <div class="hardis-tl-logs">
                        <template for:each={section.logs} for:item="logLine">
                          <template if:true={logLine.isTable}>
                            <div key={logLine.id} class="hardis-tl-block">
                              <template lwc:if={logLine.tableLog}>
                                <s-hardis-datatable
                                  key-field="id"
                                  data={logLine.tableRows}
                                  column-widths-mode="auto"
                                  columns={logLine.tableLog.columns}
                                  hide-checkbox-column
                                ></s-hardis-datatable>
                                <template if:true={logLine.tableTruncatedMessage}>
                                  <div class="slds-text-color_weak slds-p-vertical_x-small slds-text-align_center" style="font-style:italic;">
                                    {logLine.tableTruncatedMessage}
                                  </div>
                                </template>
                                <template lwc:if={logLine.tableShowMoreButton}>
                                  <div class="slds-m-top_x-small slds-align_absolute-center">
                                    <lightning-button
                                      label={i18n.seeMore}
                                      variant="neutral"
                                      data-table-id={logLine.id}
                                      onclick={handleSeeMoreTable}
                                    ></lightning-button>
                                  </div>
                                </template>
                              </template>
                            </div>
                          </template>
                          <template if:false={logLine.isTable}>
                            <div key={logLine.id} class={logLine.cssClass}>
                              <template if:true={logLine.formattedMessage}>
                                <lightning-formatted-rich-text value={logLine.formattedMessage} disable-linkify="true"></lightning-formatted-rich-text>
                              </template>
                              <template if:false={logLine.formattedMessage}>
                                <span class="log-message">{logLine.message}</span>
                              </template>
                              <template if:true={logLine.hasBigContent}>
                                <div class={logLine.bigContentClass} data-log-id={logLine.id} role="button" tabindex="0" title={i18n.viewFullContentTooltip} onclick={handleShowFullContent} onkeydown={handleContentPreviewKeydown}>
                                  <template if:true={logLine.bigContentPreview}>
                                    <pre class="hardis-content-preview-text">{logLine.bigContentPreview}</pre>
                                  </template>
                                  <span class="hardis-content-preview-more">{logLine.bigContentLabel}</span>
                                </div>
                              </template>
                            </div>
                          </template>
                        </template>
                      </div>
                    </template>
                  </template>
                </template>
              </div>
            </template>
          </template>

          <!-- Embedded PromptInput for in-panel prompts -->
          <template if:true={showEmbeddedPrompt}>
            <div class="hardis-tl-item">
              <div class="hardis-tl-node ask">
                <lightning-icon icon-name="utility:questions_and_answers" size="xx-small"></lightning-icon>
              </div>
              <div class="hardis-tl-prompt">
                <s-prompt-input prompt-data={embeddedPromptData} embedded="true" onsubmit={handleEmbeddedPromptSubmit} onexit={handleEmbeddedPromptExit}></s-prompt-input>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template if:false={logSectionsForDisplay.length}>
        <div class="slds-text-align_center slds-p-around_medium">
          <p class="slds-text-body_regular slds-text-color_weak">
            {i18n.noLogsAvailableYet}
          </p>
        </div>
      </template>
    </div>

    <!-- Reports dock: pinned under the timeline, visible without scrolling -->
    <template if:true={hasReportFiles}>
      <div class="hardis-reports-bar">
        <span class="hardis-reports-label">{reportFilesSectionTitle} · {reportFilesCount}</span>
        <template for:each={sortedReportFiles} for:item="reportFile">
          <div key={reportFile.id} class={reportFile.wrapperClass}>
            <!-- Regular button for single files -->
            <template if:false={reportFile.isDropdown}>
              <lightning-button
                variant={reportFile.buttonVariant}
                label={reportFile.title}
                icon-name={reportFile.iconName}
                icon-position="left"
                data-file-path={reportFile.file}
                onclick={handleOpenReportFile}
                title={reportFile.title}
              ></lightning-button>
            </template>

            <!-- Native SLDS split button: primary action + format/actions menu -->
            <template if:true={reportFile.isDropdown}>
              <lightning-button-group>
                <lightning-button
                  label={reportFile.title}
                  variant={reportFile.buttonVariant}
                  icon-name={reportFile.iconName}
                  icon-position="left"
                  onclick={handleDropdownMainButtonClick}
                  data-report-id={reportFile.id}
                  title={reportFile.title}
                ></lightning-button>
                <lightning-button-menu
                  variant={reportFile.menuVariant}
                  menu-alignment="bottom-right"
                  alternative-text={i18n.moreOptions}
                  title={i18n.moreOptions}
                  data-report-id={reportFile.id}
                  onselect={handleReportMenuSelect}
                >
                  <template for:each={reportFile.dropdownOptions} for:item="option">
                    <lightning-menu-item
                      key={option.format}
                      value={option.format}
                      label={option.label}
                      prefix-icon-name={option.iconName}
                    ></lightning-menu-item>
                  </template>
                </lightning-button-menu>
              </lightning-button-group>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- Full content modal: displays the complete JSON or text of a truncated log line -->
    <template if:true={isContentModalOpen}>
      <section role="dialog" tabindex="-1" class="slds-modal slds-modal_large slds-fade-in-open hardis-content-modal" aria-modal="true">
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title={i18n.closeLabel} onclick={handleCloseContentModal}>
              <lightning-icon icon-name="utility:close" alternative-text={i18n.closeLabel} size="small"></lightning-icon>
              <span class="slds-assistive-text">{i18n.closeLabel}</span>
            </button>
            <h2 class="slds-modal__title slds-hyphenate">{contentModalTitle}</h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium">
            <pre class="hardis-content-modal-text">{modalContent}</pre>
          </div>
          <footer class="slds-modal__footer">
            <lightning-button class="hardis-btn-tinted-blue" label={i18n.openWithVsCode} icon-name="utility:new_window" onclick={handleOpenModalContentInVsCode}></lightning-button>
            <lightning-button class="slds-m-left_x-small" label={i18n.copyContentLabel} icon-name="utility:copy" onclick={handleCopyModalContent}></lightning-button>
            <lightning-button class="slds-m-left_x-small" label={i18n.closeLabel} onclick={handleCloseContentModal}></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
