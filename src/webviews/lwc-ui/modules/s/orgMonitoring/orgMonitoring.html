<template>
    <div class="slds-scope blue-back">
        <div class="monitoring-container">
            <!-- Header Section -->
            <div class="hardis-page-head">
                <div class="hardis-tile featured teal">
                    <lightning-icon icon-name="utility:graph" size="medium"></lightning-icon>
                </div>
                <div class="hardis-page-head-text">
                    <h1 class="hardis-page-title">{i18n.orgMonitoringWorkbench}</h1>
                    <p class="hardis-page-subtitle">{i18n.monitorOrgDescription}</p>
                </div>
                <div class="hardis-page-head-actions">
                    <template if:true={showFilter}>
                        <lightning-input
                            label={i18n.filterMonitoringCommands}
                            type="search"
                            variant="label-hidden"
                            placeholder={i18n.filterMonitoringCommands}
                            value={filterText}
                            onchange={handleFilterChange}
                            oninput={handleFilterChange}
                            class="filter-input"
                        ></lightning-input>
                    </template>
                    <lightning-button
                        variant="neutral"
                        label={i18n.refreshLabel}
                        title={i18n.checkInstallationStatusAgain}
                        onclick={checkInstallationStatus}
                        icon-name="utility:refresh"
                    ></lightning-button>
                </div>
            </div>

            <!-- Installation Status Section -->
            <div class="section">
                <template if:true={isInstalled}>
                    <!-- Installed State -->
                    <div class="hardis-status-card ok">
                        <div class="hardis-tile green">
                            <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                        </div>
                        <div class="hardis-status-content">
                            <div class="status-header">
                                <div class="status-heading">
                                    <h3 class="hardis-status-title">{i18n.orgMonitoringIsInstalled}</h3>
                                    <p class="hardis-status-desc">{i18n.orgMonitoringConfigActive}</p>
                                </div>
                                <div class="status-actions auth-actions">
                                    <lightning-button-group>
                                        <lightning-button class="hardis-btn-tinted-blue"
                                            label={i18n.editMonitoringConfig}
                                            variant="neutral"
                                            icon-name="utility:settings"
                                            title={i18n.editMonitoringConfigTooltip}
                                            onclick={openMonitoringConfig}>
                                        </lightning-button>
                                        <lightning-button-menu
                                            label={i18n.packages}
                                            icon-name="utility:package"
                                            variant="border"
                                            alternative-text={i18n.packages}
                                            title={i18n.packages}
                                            menu-alignment="right"
                                            onselect={handlePackageMenuSelect}>
                                            <lightning-menu-item
                                                value="skip"
                                                label={i18n.skipItemsPackage}
                                                title={i18n.skipItemsPackageTooltip}
                                                prefix-icon-name="utility:ban">
                                            </lightning-menu-item>
                                            <lightning-menu-item
                                                value="backup"
                                                label={i18n.backupItemsPackage}
                                                title={i18n.backupItemsPackageTooltip}
                                                prefix-icon-name="utility:save">
                                            </lightning-menu-item>
                                            <lightning-menu-item
                                                value="all-org"
                                                label={i18n.allOrgItemsPackage}
                                                title={i18n.allOrgItemsPackageTooltip}
                                                prefix-icon-name="utility:package">
                                            </lightning-menu-item>
                                        </lightning-button-menu>
                                        <lightning-button-menu
                                            label={i18n.grafanaDashboards}
                                            icon-name="utility:metrics"
                                            variant="border"
                                            alternative-text={i18n.grafanaDashboards}
                                            title={i18n.grafanaDashboards}
                                            menu-alignment="right"
                                            onselect={handleGrafanaMenuSelect}>
                                            <lightning-menu-item
                                                value="dashboards"
                                                label={i18n.installGrafanaDashboards}
                                                title={i18n.installGrafanaDashboardsTooltip}
                                                prefix-icon-name="utility:chart">
                                            </lightning-menu-item>
                                            <lightning-menu-item
                                                value="dashboardsWithAlerts"
                                                label={i18n.installGrafanaDashboardsWithAlerts}
                                                title={i18n.installGrafanaDashboardsWithAlertsTooltip}
                                                prefix-icon-name="utility:notification">
                                            </lightning-menu-item>
                                        </lightning-button-menu>
                                        <lightning-button-menu
                                            icon-name="utility:identity"
                                            variant="border"
                                            alternative-text={i18n.authentication}
                                            title={i18n.authentication}
                                            menu-alignment="right"
                                            onselect={handleAuthMenuSelect}>
                                            <lightning-menu-item
                                                value="reconfigure"
                                                label={i18n.reconfigureAuthentication}
                                                title={i18n.reconfigureAuthTooltip}
                                                prefix-icon-name="utility:setup">
                                            </lightning-menu-item>
                                            <lightning-menu-item
                                                value="anotherOrg"
                                                label={i18n.monitorAnotherOrg}
                                                title={i18n.monitorAnotherOrgTooltip}
                                                prefix-icon-name="utility:people">
                                            </lightning-menu-item>
                                        </lightning-button-menu>
                                    </lightning-button-group>
                                </div>
                            </div>
                            <template if:true={instanceUrl}>
                                <div class="instance-url-row">
                                    <span class="slds-text-title_bold instance-url-label">{i18n.monitoredOrgLabel}</span>
                                    <lightning-button
                                        variant="base"
                                        label={instanceUrl}
                                        icon-name="utility:new_window"
                                        icon-position="right"
                                        onclick={openInstanceUrl}
                                        class="instance-url-button"
                                    ></lightning-button>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:false={isInstalled}>
                        <!-- Not Installed State -->
                        <template if:true={isCiCdRepo}>
                            <!-- CI/CD repo: informational card -->
                            <div class="hardis-status-card info">
                                <div class="hardis-tile cyan">
                                    <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                </div>
                                <div class="hardis-status-content">
                                    <h3 class="hardis-status-title">{i18n.orgMonitoringNotPresentCiCd}</h3>
                                    <p class="hardis-status-desc">
                                        {i18n.orgMonitoringNotPresentCiCdDescription}
                                    </p>
                                    <template if:true={monitoringRepository}>
                                        <div class="status-actions">
                                            <lightning-button
                                                variant="neutral"
                                                label={i18n.openMonitoringRepository}
                                                title={i18n.openMonitoringRepositoryTooltip}
                                                onclick={openMonitoringRepository}
                                                icon-name="utility:new_window"
                                                class="hardis-btn-tinted-blue"
                                            ></lightning-button>
                                            <lightning-button
                                                variant="neutral"
                                                label={i18n.learnMore}
                                                title={i18n.learnMoreTooltip}
                                                onclick={learnMore}
                                                icon-name="utility:info"
                                            ></lightning-button>
                                        </div>
                                    </template>
                                    <template if:false={monitoringRepository}>
                                        <div class="status-actions">
                                            <lightning-button
                                                variant="neutral"
                                                label={i18n.learnMore}
                                                title={i18n.learnMoreTooltip}
                                                onclick={learnMore}
                                                icon-name="utility:info"
                                            ></lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template if:false={isCiCdRepo}>
                            <div class="hardis-status-card warning">
                                <div class="hardis-tile amber">
                                    <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                                </div>
                                <div class="hardis-status-content">
                                    <h3 class="hardis-status-title">{i18n.orgMonitoringNotInstalled}</h3>
                                    <p class="hardis-status-desc">
                                        {i18n.orgMonitoringNotInstalledDescription}
                                    </p>
                                    <div class="status-actions">
                                        <lightning-button
                                            variant="neutral"
                                            label={i18n.installOrgMonitoring}
                                            title={i18n.installOrgMonitoringTooltip}
                                            onclick={installOrgMonitoring}
                                            icon-name="utility:download"
                                            class="hardis-btn-tinted-blue"
                                        ></lightning-button>
                                        <lightning-button
                                            variant="neutral"
                                            label={i18n.learnMore}
                                            title={i18n.learnMoreTooltip}
                                            onclick={learnMore}
                                            icon-name="utility:info"
                                        ></lightning-button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>
            </div>

            <!-- Monitoring Commands Section (catalog-driven, lazy-loaded) -->
            <template if:true={isCatalogLoading}>
                <div class="section">
                    <div class="slds-is-relative spinner-wrapper" style="height: 6rem;">
                        <s-spinner
                            alternative-text={i18n.loadingMonitoringConfig}
                            size="medium">
                        </s-spinner>
                    </div>
                </div>
            </template>

            <template if:true={hasNoCatalog}>
                <div class="section">
                    <div class="hardis-status-card warning">
                        <div class="hardis-tile amber">
                            <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                        </div>
                        <div class="hardis-status-content">
                            <h3 class="hardis-status-title">{i18n.monitoringConfigCatalogUnavailable}</h3>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={hasNoFilterResults}>
                <div class="section">
                    <p class="section-subtitle">{i18n.noMonitoringCommandsMatchFilter}</p>
                </div>
            </template>

            <template for:each={filteredSections} for:item="section">
                <div key={section.key} class="section">
                    <div class="hardis-group-label">{section.title}</div>
                    <p class="hardis-group-desc">{section.description}</p>
                    <div class="hardis-card-grid">
                        <template for:each={section.rows} for:item="row">
                            <div key={row.key}
                                class="hardis-card clickable"
                                title={i18n.runCommandLabel}
                                data-command={row.command}
                                role="button"
                                tabindex="0"
                                onclick={handleRunCommand}
                                onkeydown={handleCardKeydown}>
                                <div class="hardis-card-head">
                                    <div class={row.iconContainerClass}>
                                        <lightning-icon icon-name={row.iconName} size="x-small"></lightning-icon>
                                    </div>
                                    <h3 class="hardis-card-title">{row.title}</h3>
                                </div>
                                <p class="hardis-card-desc">{row.description}</p>
                                <div class="hardis-card-arrow">→</div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Documentation Section -->
            <div class="hardis-card featured monitoring-docs-card">
                <div class="hardis-card-head">
                    <div class="hardis-tile featured indigo">
                        <lightning-icon icon-name="utility:knowledge_base" size="medium"></lightning-icon>
                    </div>
                    <h3 class="hardis-card-title">{i18n.learnMore}</h3>
                </div>
                <p class="hardis-card-desc">{i18n.learnMoreDocDescription}</p>
                <div class="hardis-card-actions">
                    <lightning-button class="hardis-btn-tinted-blue"
                        variant="neutral"
                        label={i18n.monitoringDocumentation}
                        icon-name="utility:new_window"
                        onclick={openMonitoringDocs}
                    ></lightning-button>
                    <lightning-button class="hardis-btn-tinted-blue"
                        variant="neutral"
                        label={i18n.setupGuide}
                        icon-name="utility:setup"
                        onclick={openSetupGuide}
                    ></lightning-button>
                </div>
            </div>
        </div>
    </div>
</template>
