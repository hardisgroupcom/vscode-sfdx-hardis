<template>
    <template if:true={isVisible}>
        <div class="slds-scope hardis-prompt-card" onkeydown={handleKeyDown}>
            <!-- "The CLI is waiting for you" eyebrow -->
            <div class="hardis-prompt-eyebrow">
                <span class="hardis-pill-dot"></span>{i18n.waitingForYourAnswer}
            </div>

            <!-- Prompt message -->
            <div class="hardis-prompt-head">
                <div class="hardis-prompt-q prompt-message-content"></div>
                <template if:true={promptDescription}>
                    <lightning-helptext content={promptDescription}></lightning-helptext>
                </template>
            </div>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-m-bottom_small">
                    <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                        <span class="slds-assistive-text">{i18n.errorLabel}</span>
                        <span>{error}</span>
                    </div>
                </div>
            </template>

            <!-- Text Input -->
            <template if:true={isTextInput}>
                <div class="slds-m-bottom_small">
                    <lightning-input
                        type="text"
                        label={i18n.yourInput}
                        placeholder={promptPlaceholder}
                        value={inputValue}
                        onchange={handleInputChange}
                        oninput={handleInputChange}
                        onkeydown={handleKeyDown}>
                    </lightning-input>
                </div>
            </template>

            <!-- Number Input -->
            <template if:true={isNumberInput}>
                <div class="slds-m-bottom_small">
                    <lightning-input
                        type="number"
                        label={i18n.yourInput}
                        placeholder={promptPlaceholder}
                        value={inputValue}
                        step={numberStep}
                        onchange={handleInputChange}
                        oninput={handleInputChange}
                        onkeydown={handleKeyDown}>
                    </lightning-input>
                </div>
            </template>

            <!-- Select with radio-cards (5 or fewer choices, click = answer) -->
            <template if:true={isSelectWithButtons}>
                <div class="slds-m-bottom_x-small">
                    <template for:each={selectOptionsDecorated} for:item="option">
                        <button
                            key={option.value}
                            type="button"
                            class="hardis-option-card select-option-button"
                            data-value={option.value}
                            onclick={handleButtonSelect}
                            onkeydown={handleKeyDown}>
                            <template if:true={option.emoji}>
                                <span class="hardis-option-emoji" aria-hidden="true">{option.emoji}</span>
                            </template>
                            <span class="hardis-option-main">
                                <span class="hardis-option-label">{option.labelClean}</span>
                                <template if:true={option.description}>
                                    <span class="hardis-option-desc">{option.description}</span>
                                </template>
                            </span>
                        </button>
                    </template>
                </div>
            </template>

            <!-- Select from a scrollable, filterable list (more than 5 choices) -->
            <template if:true={isSelectWithList}>
                <div class="slds-m-bottom_x-small">
                    <div class="hardis-prompt-tools">
                        <lightning-input
                            type="search"
                            variant="label-hidden"
                            placeholder={i18n.typeToFilter}
                            value={comboboxFilter}
                            onchange={handleComboboxFilterChange}
                            oninput={handleComboboxFilterChange}
                            class="hardis-prompt-filter"
                            aria-label={i18n.filterOptions}>
                        </lightning-input>
                        <span class="hardis-count-chip">{listCountLabel}</span>
                    </div>
                    <div class="hardis-option-list" role="listbox">
                        <template for:each={filteredListOptions} for:item="option">
                            <button
                                key={option.value}
                                type="button"
                                class={option.rowClass}
                                data-value={option.value}
                                role="option"
                                aria-selected={option.selected}
                                onclick={handleButtonSelect}
                                onkeydown={handleOptionRowKeydown}>
                                <template if:true={option.emoji}>
                                    <span class="hardis-option-emoji" aria-hidden="true">{option.emoji}</span>
                                </template>
                                <span class="hardis-option-main">
                                    <span class="hardis-option-label">{option.labelClean}</span>
                                    <template if:true={option.description}>
                                        <span class="hardis-option-desc">{option.description}</span>
                                    </template>
                                </span>
                            </button>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Multiselect: filter + count + select all/clear, then checkbox rows -->
            <template if:true={isMultiselectInput}>
                <div class="slds-m-bottom_x-small">
                    <div class="hardis-prompt-tools">
                        <lightning-input
                            type="search"
                            variant="label-hidden"
                            placeholder={i18n.typeToFilter}
                            value={multiselectFilter}
                            onchange={handleMultiselectFilterChange}
                            oninput={handleMultiselectFilterChange}
                            class="hardis-prompt-filter"
                            aria-label={i18n.filterOptions}>
                        </lightning-input>
                        <span class="hardis-count-chip">{selectedCountLabel}</span>
                        <button type="button" class="hardis-textlink" onclick={handleSelectAll} disabled={allItemsSelected}>{i18n.selectAll}</button>
                        <button type="button" class="hardis-textlink" onclick={handleUnselectAll} disabled={noItemsSelected}>{i18n.unselectAll}</button>
                        <button type="button" class="hardis-textlink" onclick={handleToggleShowOnlySelected}>{showOnlySelectedLabel}</button>
                    </div>
                    <div class="hardis-option-list" role="listbox" aria-multiselectable="true">
                        <template for:each={filteredMultiselectOptions} for:item="option">
                            <button
                                key={option.value}
                                type="button"
                                class={option.rowClass}
                                data-value={option.value}
                                role="option"
                                aria-selected={option.checked}
                                onclick={handleMultiselectRowToggle}
                                onkeydown={handleOptionRowKeydown}>
                                <span class="hardis-check">
                                    <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                </span>
                                <span class="hardis-option-main">
                                    <span class="hardis-option-label">{option.label}</span>
                                    <template if:true={option.description}>
                                        <span class="hardis-option-desc">{option.description}</span>
                                    </template>
                                </span>
                            </button>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Footer: keyboard hint + actions -->
            <template if:false={isClickToAnswerSelect}>
                <div class="hardis-prompt-foot">
                    <span>{i18n.pressEnterToValidate}</span>
                    <div class="hardis-prompt-foot-actions">
                        <lightning-button
                            data-id="cancelBtn"
                            variant="neutral"
                            label={i18n.cancel}
                            tabindex="-1"
                            icon-name="utility:close"
                            onclick={handleCancel}>
                        </lightning-button>
                        <span class="hardis-btn-tinted-blue">
                            <lightning-button
                                variant="neutral"
                                label={validateLabel}
                                tabindex="0"
                                icon-name="utility:check"
                                onclick={handleSubmit}>
                            </lightning-button>
                        </span>
                    </div>
                </div>
            </template>

            <!-- Cancel-only footer for click-to-answer selects -->
            <template if:true={isClickToAnswerSelect}>
                <div class="hardis-prompt-foot">
                    <span>{i18n.clickOptionToSelect}</span>
                    <div class="hardis-prompt-foot-actions">
                        <lightning-button
                            data-id="cancelBtn"
                            variant="neutral"
                            label={i18n.cancel}
                            icon-name="utility:close"
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </div>
    </template>
    <!-- Simple submission spinner -->
    <template if:true={isSubmitting}>
        <div class="slds-p-around_large slds-align_absolute-center">
            <lightning-spinner
                alternative-text="Submitting response..."
                size="medium"
                variant="brand">
            </lightning-spinner>
        </div>
    </template>
</template>
