<template>
  <div class="slds-scope blue-back" data-theme={colorTheme} data-contrast={colorContrast}>
      <div class="slds-scope slds-p-around_small blue-back">
          <div class="hardis-page-head">
              <div class="hardis-tile featured slate">
                  <lightning-icon icon-name="utility:settings" size="medium"></lightning-icon>
              </div>
              <div class="hardis-page-head-text">
                  <h1 class="hardis-page-title">{i18n.sfdxHardisSettings}</h1>
                  <p class="hardis-page-subtitle">{i18n.extensionSettingsSubtitle}</p>
              </div>
              <div class="hardis-page-head-actions">
                  <lightning-button variant="neutral" label={i18n.refreshLabel} onclick={handleRefresh}></lightning-button>
              </div>
          </div>

          <!-- Panel-level three-state body switch -->
          <template if:true={isLoadingState}>
              <div class="slds-is-relative slds-p-vertical_large slds-text-align_center">
                  <lightning-spinner alternative-text={i18n.loadingLabel} size="medium"></lightning-spinner>
              </div>
          </template>
          <template if:true={hasError}>
              <div class="slds-text-align_center slds-p-around_large">
                  <p>{i18n.featureLoadFailed}</p>
                  <p class="slds-text-color_weak slds-text-body_small slds-m-top_small">{loadError}</p>
                  <div class="slds-m-top_medium"><lightning-button label={i18n.tryAgainLabel} onclick={handleRetry}></lightning-button></div>
              </div>
          </template>
          <template if:true={isReady}>

          <template if:true={loading}>
                  <div class="slds-text-body_regular">{i18n.loadingExtensionSettings}</div>
          </template>
          <template if:true={error}>
              <div class="slds-text-color_error">{error}</div>
          </template>

          <div class="slds-p-horizontal_small">
              <template if:false={loading}>
                  <template if:true={sections}>
                      <div class="hardis-panel-body ecfg-body">
                          <lightning-tabset active-tab-value={activeTabValue}>
                              <template for:each={sections} for:item="section" for:index="index">
                                  <lightning-tab key={section.value} value={section.value} label={section.label} icon-name={section.iconName}>
                                      <div class="slds-p-around_medium">
                                          <template if:true={section.description}>
                                              <div class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                                                  {section.description}
                                              </div>
                                          </template>
                                          <template for:each={section.entries} for:item="entry">
                                              <div key={entry.key} class="hardis-field-row">
                                                  <div class="hardis-field-text">
                                                      <div class="hardis-field-label">
                                                          <span>{entry.label}</span>
                                                          <template if:true={entry.isMultilineHelp}>
                                                              <s-multiline-helptext content={entry.description} class="slds-icon-text-info"></s-multiline-helptext>
                                                          </template>
                                                      </div>
                                                      <template if:true={entry.helpFirstLine}>
                                                          <div class="hardis-field-help">{entry.helpFirstLine}</div>
                                                      </template>
                                                  </div>
                                                  <div class="hardis-field-control">
                                                      <template if:true={entry.isEnum}>
                                                          <lightning-combobox
                                                              name={entry.key}
                                                              value={entry.valueEnum}
                                                              options={entry.optionsLwc}
                                                              onchange={handleSelectChange}
                                                              label={entry.label}
                                                              variant="label-hidden"
                                                          ></lightning-combobox>
                                                      </template>
                                                      <template if:true={entry.isBoolean}>
                                                          <lightning-input
                                                              type="toggle"
                                                              name={entry.key}
                                                              checked={entry.valueBoolean}
                                                              onchange={handleCheckboxChange}
                                                              oninput={handleCheckboxChange}
                                                              label={entry.label}
                                                              variant="label-hidden"
                                                              message-toggle-active=""
                                                              message-toggle-inactive=""
                                                          ></lightning-input>
                                                      </template>
                                                      <template if:true={entry.isString}>
                                                          <lightning-input
                                                              type="text"
                                                              name={entry.key}
                                                              value={entry.valueString}
                                                              onchange={handleTextChange}
                                                              label={entry.label}
                                                              variant="label-hidden"
                                                          ></lightning-input>
                                                      </template>
                                                      <template if:true={entry.isNumber}>
                                                          <lightning-input
                                                              type="number"
                                                              name={entry.key}
                                                              value={entry.valueNumber}
                                                              onchange={handleNumberChange}
                                                              label={entry.label}
                                                              variant="label-hidden"
                                                          ></lightning-input>
                                                      </template>
                                                      <template if:true={entry.isArray}>
                                                          <lightning-textarea
                                                              name={entry.key}
                                                              value={entry.valueArray}
                                                              onchange={handleTextareaChange}
                                                              label={entry.label}
                                                              variant="label-hidden"
                                                              placeholder={i18n.enterOneItemPerLine}
                                                          ></lightning-textarea>
                                                      </template>
                                                  </div>
                                              </div>
                                          </template>
                                      </div>
                                  </lightning-tab>
                              </template>
                          </lightning-tabset>
                      </div>
                  </template>
              </template>
          </div>

          </template><!-- end isReady -->
      </div>
  </div>
</template>
