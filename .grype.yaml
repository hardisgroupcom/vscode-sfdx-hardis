# Grype configuration for the SFDX Hardis VS Code extension.
# Fail the scan on findings at or above the "medium" severity threshold (MegaLinter default behavior).
fail-on-severity: medium
ignore:
  # GHSA-8988-4f7v-96qf / CVE-2026-54285 - @opentelemetry/core 1.30.1.
  # Pinned inside @vscode/extension-telemetry > applicationinsights (1.x SDK tree); no patched 1.x
  # release exists (fix is only 2.8.0) and the 2.x copies are already resolved to 2.8.0 via resolutions.
  # The CVE is unbounded memory allocation while PARSING an inbound W3C Baggage header; this extension
  # only EMITS outbound telemetry and never parses attacker-controlled baggage headers, so the path is
  # not reachable. Re-evaluate (~2026-09-18) when applicationinsights ships an OTel 2.x line.
  - vulnerability: GHSA-8988-4f7v-96qf
    package:
      name: "@opentelemetry/core"
      version: 1.30.1

  # mermaid 11.15.0 - the five advisories below are all fixed only in 11.16.1, and the vulnerable code
  # is mermaid's own (no sub-package to pin through resolutions). 11.16.x cannot be adopted: it regresses
  # the DevOps Pipeline cluster layout (Salesforce Orgs subgraph loses "direction TB" and deployment links
  # stop at the subgraph border), which is why mermaid is pinned to exactly 11.15.0.
  # Input analysis, valid for all five entries: this extension renders exactly one diagram. Its source is
  # generated by src/utils/pipeline/branchStrategyMermaidBuilder.ts (always "flowchart LR", preceded by our
  # own %%{init}%% directive) and is passed to the single mermaid.render() call in
  # src/webviews/lwc-ui/modules/s/pipeline/pipeline.js. There is no markdown / ```mermaid fence rendering
  # anywhere in the extension, so no third-party diagram source is ever parsed.
  # Re-evaluate all five (~2026-11-16), or as soon as mermaid ships a fix for the 11.16 layout regression.

  # GHSA-6x64-9x62-f2gx / CVE-2026-71436 - DoS in the XY Charts diagram.
  # Not reachable: the only diagram type this extension emits is "flowchart LR"
  # (branchStrategyMermaidBuilder.ts), and the diagram header line is ours, so the XY Charts parser is
  # never entered.
  - vulnerability: GHSA-6x64-9x62-f2gx
    package:
      name: mermaid
      version: 11.15.0

  # GHSA-rhh3-jpg6-66xh / CVE-2026-71439 - DoS via the "ticks" option of the Radar diagram.
  # Not reachable, same proof: only "flowchart LR" is ever generated
  # (branchStrategyMermaidBuilder.ts), so the Radar parser is never entered.
  - vulnerability: GHSA-rhh3-jpg6-66xh
    package:
      name: mermaid
      version: 11.15.0

  # GHSA-c4c3-pg64-4m4v / CVE-2026-71438 - prototype pollution through the mermaid config APIs.
  # Not reachable: mermaid.initialize() is called once, in src/webviews/lwc-ui-panel.ts, with a literal
  # config object whose only variable parts are two theme colors picked from a hardcoded light/dark table.
  # No user, workspace or remote data ever reaches a mermaid config API.
  - vulnerability: GHSA-c4c3-pg64-4m4v
    package:
      name: mermaid
      version: 11.15.0

  # GHSA-3rrr-jr9j-h3q3 / CVE-2026-71437 - prototype pollution reachable from diagram input.
  # Accepted risk, NOT proven unreachable. The diagram structure is ours, but node labels embed branch
  # names and org aliases verbatim (branchStrategyMermaidBuilder.ts), and for open pull requests the
  # source branch name comes from the git provider - so on a public repository a fork PR author
  # influences part of the diagram text. Accepted because exploitation requires the developer to open the
  # DevOps Pipeline panel on a repository with hostile PR branch names, the panel is a local read-only
  # webview, and the diagram type line plus the %%{init}%% directive are emitted by us, not by the input.
  - vulnerability: GHSA-3rrr-jr9j-h3q3
    package:
      name: mermaid
      version: 11.15.0

  # GHSA-2v8p-3f2j-5mp7 / CVE-2026-50159 - CSS injection through diagram input.
  # Accepted risk, NOT proven unreachable - same input analysis as GHSA-3rrr-jr9j-h3q3: labels are
  # interpolated raw and mermaid runs with securityLevel 'loose' (needed for the clickable PR links in
  # edge labels). Accepted because the impact is bounded to restyling the local Pipeline webview: CSS
  # cannot execute script, and the panel renders no credentials, tokens or org access data.
  - vulnerability: GHSA-2v8p-3f2j-5mp7
    package:
      name: mermaid
      version: 11.15.0
