# Gitleaks configuration for vscode-sfdx-hardis
# MegaLinter passes this repo-root file to gitleaks via --config.
# It extends the default gitleaks ruleset and allowlists known false positives.

[extend]
useDefault = true

[allowlist]
description = "Allowlisted false positives"
# The Application Insights telemetry instrumentation key is a public, non-secret
# identifier intentionally embedded per VS Code telemetry guidelines
# (https://code.visualstudio.com/api/extension-guides/telemetry).
# It only routes anonymous telemetry to the publisher's dashboard and grants no access.
paths = [
  '''src/extension\.ts''',
  # betterleaks (new in the MegaLinter beta image) reports a generic-password for
  # every translation key with "Password" in its name (enterJiraPassword...) and
  # for the label key map of the Browserforce setting editor. They are UI labels
  # and key names, never values.
  '''src/i18n/[A-Za-z-]+\.json''',
  '''src/webviews/lwc-ui/modules/s/browserforceSettingEditor/browserforceSettingEditor\.js''',
  # Fake credentials written on purpose as test inputs (user:token@host, pass=...).
  '''src/test/suite/envFileCredentials\.test\.ts''',
  '''src/test/suite/gitUrlUtils\.test\.ts''',
  '''src/test/suite/scratchOrgPoolUtils\.test\.ts''',
]
regexes = [
  '''cf83e6dc-2621-4cb6-b92b-30905d1c8476''',
  # Translation key NAMES of the custom functions feature, never values. A long
  # camelCase key such as customFunctionInputTypeMultiline is a run of 32
  # alphanumeric characters, which is also the shape of a Box API access token,
  # so the scanner reports one of them per run in each of the nine locale files.
  # The labels themselves are UI strings ("Long text", "Checkbox"), and the
  # Secret input type stores the NAME of a CI/CD variable, never its value.
  '''customFunction[A-Za-z]+''',
]
